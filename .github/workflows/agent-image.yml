name: agent image

# Builds images/agent and checks it on every change to the image or its check. The image
# that agent sessions run is built on the imp host with `imp image build`, not here; see
# docs/runbooks/agent-image.md.
on:
  push:
    branches: [main]
    paths:
      - images/agent/**
      - scripts/check-agent-image.sh
      - scripts/agent-image-gitleaks.toml
      - .github/workflows/agent-image.yml
  pull_request:
    paths:
      - images/agent/**
      - scripts/check-agent-image.sh
      - scripts/agent-image-gitleaks.toml
      - .github/workflows/agent-image.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Build and check
        run: bun run test:agent-image

  # atc's release job opens the atc pin pull request on the atc-pin/agent-image branch with the
  # release bot (scripts/open-atc-pin-pr.sh). Once the image check above passes, and the diff
  # changes only the two atc pins, this job turns on auto-merge; the ruleset's required checks
  # still gate the merge. Any other pull request, author or diff waits for a person. A newer pin
  # cancels this job for the older head, and --match-head-commit keeps a late run from turning
  # auto-merge on for a head it did not check.
  auto-merge:
    needs: check
    if: >-
      github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name ==
      github.repository && github.event.pull_request.head.ref == 'atc-pin/agent-image' &&
      github.event.pull_request.user.login == 'zgeoff-release-bot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: atc-pin-auto-merge-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: write
      pull-requests: write
    steps:
      # the full history, so the check can find the merge base with the pull request's base
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Check that the diff changes only the atc pins
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bun run --silent ci:check-atc-pin-diff "$BASE_SHA" "$HEAD_SHA"

      - name: Turn on auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run:
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --auto --squash --match-head-commit
          "$HEAD_SHA"
