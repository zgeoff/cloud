name: agent image

# Builds images/agent and checks it on every change to the image or its check. The image
# that agent sessions run is built on the imp host with `impz image build`, not here; see
# docs/runbooks/agent-image.md.
on:
  push:
    branches: [main]
    paths:
      - images/agent/**
      - scripts/*agent-image*
      - test-support/shell/*-stub-apt-*
      - .github/workflows/agent-image.yml
  pull_request:
    paths:
      - images/agent/**
      - scripts/*agent-image*
      - test-support/shell/*-stub-apt-*
      - .github/workflows/agent-image.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Build and check
        run: bun run test:agent-image
