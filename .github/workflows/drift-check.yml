name: Drift check

# Checks prod for drift every day, with credentials that can only read: a refresh that only
# previews (scripts/check-scheduled-drift.sh) compares each resource's live state with the state
# file and changes neither, and it fails on any change. It catches a change made outside Pulumi,
# such as in a console, which no push to main shows. Its credentials come from the 1Password vault
# cloud-ci, which holds read-only or scoped copies, and never the Onidel key; the check leaves the
# Onidel and Kubernetes resources out. Discord gets drift, a failed check and a cancelled run, as
# Deploy prod posts its own. docs/runbooks/drift-check.md covers the vault, the schedule and a run.
on:
  schedule:
    # 05:41 UTC: GitHub's docs say scheduled runs queue at the start of each hour, so off the hour
    - cron: '41 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: drift
    # the prod apply's group, so a check never reads the state while an apply writes it, and an
    # apply waits for a check to end. queue: max keeps every waiting run, and actionlint 1.7.12
    # rejects the key, so .github/actionlint.yaml ignores that error.
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
      queue: max
    outputs:
      outcome: ${{ steps.check.outputs.outcome }}
    env:
      LEFTHOOK: 0
      PULUMI_SKIP_UPDATE_CHECK: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # go.sum sits in provider/, not at the root, so the cache needs its path to find its key
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: provider/go.mod
          cache-dependency-path: provider/go.sum

      # the CLI release that matches the program's @pulumi/pulumi
      - name: Setup Pulumi
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
        with:
          pulumi-version: 3.268.0

      - name: Install
        run: bun install --frozen-lockfile

      # Pulumi.yaml loads the Onidel plugin from provider/bin, and the engine loads each provider
      # the state records, even with the Onidel resources left out of the refresh
      - name: Build the Onidel provider
        run: bun run provider:build

      # the cloud-ci vault's account reads that vault only; docs/runbooks/drift-check.md lists each
      # item and its scope. GitHub masks each value in the log.
      - name: Load the check's credentials
        uses: 1password/load-secrets-action@eb2efd0703da22a93c467f2d1ffbb6826c11e19c # v4.1.1
        with:
          export-env: true
          version: 2.40.0
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          PULUMI_BACKEND_URL: op://cloud-ci/r2-pulumi-state-read/backend-url
          AWS_ACCESS_KEY_ID: op://cloud-ci/r2-pulumi-state-read/access-key-id
          AWS_SECRET_ACCESS_KEY: op://cloud-ci/r2-pulumi-state-read/secret-access-key
          PULUMI_CONFIG_PASSPHRASE: op://cloud-ci/pulumi-passphrase/credential
          CLOUDFLARE_API_TOKEN: op://cloud-ci/cloudflare-read/credential
          TAILSCALE_OAUTH_CLIENT_ID: op://cloud-ci/tailscale-read/client-id
          TAILSCALE_OAUTH_CLIENT_SECRET: op://cloud-ci/tailscale-read/client-secret
          TAILSCALE_TAILNET: op://cloud-ci/tailscale-read/tailnet

      # GITHUB_TOKEN is what Pulumi sends when it downloads a plugin from GitHub, because GitHub
      # limits the runners' shared address to 60 calls an hour without it
      - name: Check drift
        id: check
        env:
          AWS_REGION: auto
          GITHUB_TOKEN: ${{ github.token }}
        run: bun run ci:check-scheduled-drift --suppress-outputs

  # posts drift, a failed check and a cancelled run to Discord
  alert:
    needs: [check]
    if: always() && (needs.check.result == 'failure' || needs.check.result == 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: drift
    env:
      OUTCOME: ${{ needs.check.outputs.outcome }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Load the webhook
        uses: 1password/load-secrets-action@eb2efd0703da22a93c467f2d1ffbb6826c11e19c # v4.1.1
        with:
          export-env: true
          version: 2.40.0
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          ALERT_WEBHOOK_URL: op://cloud-ci/alert-webhook/credential

      - name: Alert on Discord
        run: bun run ci:alert-scheduled-drift
