name: atc-gateway images

# Runs the fixture test on every push to main that changes the images; CI's checks job runs it on
# a pull request. Only main publishes to GHCR: a push to main whose images/atc-gateway/versions.env
# pins a tag the registry lacks, or a manual run on main with push: true
# (scripts/release/decide-gateway-publish.ts). A newer push cancels an older run's fixture and
# decision, and its own decision still finds any tag the older run never published. The release
# job refuses any ref but main and never cancels. After the
# push, the release job opens the pull request that pins the new digests in infra/Pulumi.prod.yaml,
# as the release check app, so CI runs on it; the release bump merge workflow merges it by its
# rules, and the Deploy prod workflow applies it (docs/runbooks/release-check.md).
on:
  push:
    branches: [main]
    paths:
      - images/atc-gateway/**
      - scripts/fetch-atc-release.sh
      - scripts/publish-atc-gateway-images.sh
      - scripts/run-shell-suites.sh
      - e2e/test-atc-gateway-restore.sh
      - infra/cluster/build-atc-gateway-spec.ts
      - infra/cluster/create-atc-gateway-backup-job.ts
      - infra/cluster/build-atc-gateway-backup-pod-spec.ts
      - test-support/shell/**
      - .github/workflows/atc-gateway-images.yml
  workflow_dispatch:
    inputs:
      push:
        description: Publish both images to ghcr.io/zgeoff after the fixture test
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: atc-gateway-fixture-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Fixture test
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun run test:atc-gateway-fixture

  decide:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    concurrency:
      group: atc-gateway-decide-${{ github.ref }}
      cancel-in-progress: true
    # packages: read looks up the pinned tags on ghcr.io
    permissions:
      contents: read
      packages: read
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Decide whether to publish
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PUSH_INPUT: ${{ inputs.push }}
          GH_TOKEN: ${{ github.token }}
        run: bun run --silent ci:decide-atc-gateway-publish

  publish:
    name: Release the images
    needs: [fixture, decide]
    if: github.ref == 'refs/heads/main' && needs.decide.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # one publish at a time; a newer push waits, and replaces any older one still waiting, since
    # its commit holds every earlier pin change
    concurrency:
      group: atc-gateway-publish
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Mint the release check app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_CHECK_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_CHECK_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # the full history of main, so the pull request step can compare its branch with the merge base
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # also signs docker in to ghcr.io, which the pull request step reads the digests from
      - name: Build and push
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun run ci:publish-atc-gateway-images

      # commits as the app's bot user, so the release bump merge accepts the commit
      - name: Set the git identity
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: bun run --silent ci:set-release-bot-identity "$SLUG"

      - name: Open or update the pull request that pins the digests
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_TELEMETRY: '0'
          DO_NOT_TRACK: '1'
          GH_NO_UPDATE_NOTIFIER: '1'
        run: bun run --silent ci:pin-atc-gateway-images
