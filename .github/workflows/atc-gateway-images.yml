name: atc-gateway images

# Runs the fixture test on every change to the images. Publishing to GHCR happens
# only on a manual run with push: true, an operator step that needs approval.
on:
  push:
    branches: [main]
    paths:
      - deploy/atc-gateway/**
      - scripts/fetch-atc-release.sh
      - scripts/run-shell-suites.sh
      - e2e/test-atc-gateway-restore.sh
      - infra/build-atc-gateway-spec.ts
      - infra/create-atc-gateway-backup-job.ts
      - infra/build-atc-gateway-backup-pod-spec.ts
      - scripts/test-lib/**
      - .github/workflows/atc-gateway-images.yml
  pull_request:
    paths:
      - deploy/atc-gateway/**
      - scripts/fetch-atc-release.sh
      - scripts/run-shell-suites.sh
      - e2e/test-atc-gateway-restore.sh
      - infra/build-atc-gateway-spec.ts
      - infra/create-atc-gateway-backup-job.ts
      - infra/build-atc-gateway-backup-pod-spec.ts
      - scripts/test-lib/**
      - .github/workflows/atc-gateway-images.yml
  workflow_dispatch:
    inputs:
      push:
        description: Publish both images to ghcr.io/zgeoff after the fixture test
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Fixture test
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun run test:atc-gateway-fixture

  publish:
    needs: fixture
    if: github.event_name == 'workflow_dispatch' && inputs.push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Build and push
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun run ci:publish-atc-gateway-images
