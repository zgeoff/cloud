name: nixie backup

# Runs the fixture test of nixie's backup script, in the backup image the stack config pins, on
# every change to the script, its test, the helpers it uses, the pin, or the Bun that reads it.
on:
  push:
    branches: [main]
    paths:
      - deploy/nixie/backup/**
      - scripts/run-shell-suites.sh
      - test-support/shell/run-cases.sh
      - test-support/shell/run-backup.sh
      - test-support/shell/run-backup-shell.sh
      - test-support/shell/normalize-restic-output.sh
      - infra/Pulumi.prod.yaml
      - .bun-version
      - package.json
      - .github/workflows/nixie-backup.yml
  pull_request:
    paths:
      - deploy/nixie/backup/**
      - scripts/run-shell-suites.sh
      - test-support/shell/run-cases.sh
      - test-support/shell/run-backup.sh
      - test-support/shell/run-backup-shell.sh
      - test-support/shell/normalize-restic-output.sh
      - infra/Pulumi.prod.yaml
      - .bun-version
      - package.json
      - .github/workflows/nixie-backup.yml

permissions:
  contents: read
  packages: read

jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # the backup image is a private GHCR package, so docker pulls it with the workflow token
      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run login:ghcr

      - name: Fixture test
        run: bun run test:nixie-backup-fixture
