name: release bump merge

# Merges a release check pull request (release-check/<dependency>, opened by the release check
# workflow, or by the atc-gateway images workflow for the images it publishes) once it may merge on
# its own: scripts/release/decide.ts holds the rules. It runs each time CI, whose checks job holds
# every check of such a pull request, finishes on one, and each time such a pull request gets the
# auto-merge label, so a label put back after its checks finished still merges it
# (scripts/release/find-event-branch.ts). The workflow_run trigger's branches filter starts no run
# for a check on any other branch, and the job's condition skips a run for any other label or event.
#
# pull_request_target runs this workflow and checks out main, never the pull request's head, so
# the app's token never meets code from the pull request.
#
# It reads the pull request with GITHUB_TOKEN and merges with the release check app's token, so
# the push to main starts its workflows. The app and its secrets are the release check workflow's.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: ['release-check/**']
  pull_request_target:
    types: [labeled]

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read

jobs:
  merge:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' &&
      startsWith(github.event.workflow_run.head_branch, 'release-check/') &&
      github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'pull_request_target' && github.event.label.name == 'auto-merge' &&
      startsWith(github.event.pull_request.head.ref, 'release-check/') &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-slim
    timeout-minutes: 5
    # one decision per branch at a time, so two finishing checks never merge twice
    concurrency:
      group:
        release-bump-merge-${{ github.event.workflow_run.head_branch ||
        github.event.pull_request.head.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Mint the release check app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_CHECK_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_CHECK_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Merge the pull request if it may merge on its own
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_LOGIN: app/${{ steps.app-token.outputs.app-slug }}
          GH_TELEMETRY: '0'
          DO_NOT_TRACK: '1'
          GH_NO_UPDATE_NOTIFIER: '1'
        run: bun run --silent ci:decide-release-bump-merge
