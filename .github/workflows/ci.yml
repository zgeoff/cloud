name: CI

# One job for the secret scan, the Bun checks and the provider's Go checks, so a run bills one
# runner minute where three jobs billed three. The job runs on every pull request and every push
# to main; scripts/needs-provider-check.sh decides whether the change touches an input of the Go
# checks or the generated SDK, and the job runs them and the SDK check only then.
# scripts/needs-full-checks.sh decides the same way whether any changed file is not Markdown, and
# the job runs the four Nix-image linters and the shell suites only then: they take most of its
# time, and none of them reads a Markdown file. A failed decision or a failed check fails the job.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # the gitleaks action comments findings on the PR, which needs write on pull-requests; the
    # image pin check reads the private ghcr.io/zgeoff packages, which needs read on packages
    permissions:
      contents: read
      packages: read
      pull-requests: write
    env:
      LEFTHOOK: 0
    steps:
      # the full history, for gitleaks' commit range and the provider decision's merge base
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # a pull request compares its base with the merge commit under test; a push compares the
      # commit before it (all zeros for a new branch, which needs the checks)
      - name: Decide whether the change needs the provider checks
        id: decide
        env:
          BASE:
            ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha ||
            github.event.before }}
        run: bun run --silent ci:decide-provider-checks "$BASE" "$GITHUB_SHA"

      - name: Decide whether the change needs the full checks
        id: decide-full
        env:
          BASE:
            ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha ||
            github.event.before }}
        run: bun run --silent ci:decide-full-checks "$BASE" "$GITHUB_SHA"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Format
        run: bun run format:check

      - name: Lint
        run: bun run lint:full

      # the four linters run tools from nixos/flake.lock's nixpkgs in the pinned Nix image; the
      # first one fills the job's Nix store volume for the others
      - name: Lint shell
        if: steps.decide-full.outputs.full == 'true'
        run: bun run lint:sh

      - name: Lint Nix
        if: steps.decide-full.outputs.full == 'true'
        run: bun run lint:nix

      - name: Lint Python
        if: steps.decide-full.outputs.full == 'true'
        run: bun run lint:py

      # actionlint, then the check that every run step is setup or one bun run call
      - name: Lint Actions
        if: steps.decide-full.outputs.full == 'true'
        run: bun run lint:actions

      - name: Doc links
        run: bun run check:doc-links

      # Some READMEs and docs/ pages fail the shared length or prose rules, so this step reports
      # its findings without failing the run.
      - name: Doc length and prose
        continue-on-error: true
        run: bun run check:doc-length

      - name: Pulumi pins
        run: bun run check:pulumi-pins

      # the copies of shared constants that stay outside packages/topology agree with it
      - name: Topology
        run: bun run check:topology

      # each release tag still names its pinned digest, and each upstream digest is still served
      - name: Image pins
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run check:image-pins

      # each release registry pin in the checkout holds what the pin table holds
      - name: Release pins
        run: bun run check:release-pins

      # each restore Job's YAML is its backup pod builder's output
      - name: Restore jobs
        run: bun run check:restore-job

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Test Health Check
        run: bun run test:health-check

      - name: Test Preview
        run: bun run test:preview

      # bash, git, jq, openssl, curl, python3, coreutils and gh, all on ubuntu-latest's image;
      # the ubuntu-24.04 image 20260927.320.1 readme lists GitHub CLI 2.101.0, which the GitHub
      # API stand-in's real-gh case (test-support/shell/test-start-stub-github-api.sh) runs
      - name: Test Scripts
        if: steps.decide-full.outputs.full == 'true'
        run: bun run test:scripts

      # the pinned blackbox exporter and promtool in Docker, against the probe and the rules the
      # repo builds, so a body with failing turns fires NixieTurnsFailing and a clear one does not
      - name: Test Alert Rules
        run: bun run test:alert-rules

      - name: Dead Code
        run: bun run deadcode

      # last, because the action leaves results.sarif in the checkout, which the format check
      # would flag; it runs even after a failed check, so every run still scans for secrets
      - name: Gitleaks
        if: ${{ !cancelled() }}
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1

      # go.sum sits in provider/, not at the root, so the cache needs its path to find its key
      - name: Setup Go
        if: steps.decide.outputs.provider == 'true' && hashFiles('provider/go.mod') != ''
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: provider/go.mod
          # tools.sum holds the linters check.sh runs with go tool
          cache-dependency-path: |
            provider/go.sum
            provider/tools.sum

      - name: Provider checks
        if: steps.decide.outputs.provider == 'true'
        run: bun run provider:check

      # the Pulumi CLI at infra's @pulumi/pulumi pin, so the SDK check has no pin of its own;
      # the tarball is checked against the release's checksum file
      - name: Setup Pulumi CLI
        if: steps.decide.outputs.provider == 'true'
        run: bun run ci:install-pulumi-cli

      - name: SDK check
        if: steps.decide.outputs.provider == 'true'
        run: bun run check:sdk
