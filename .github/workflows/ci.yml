name: CI

# One job for the secret scan, the Bun checks and the provider's Go checks, so a run bills one
# runner minute where three jobs billed three. The job runs on every pull request and every push
# to main; scripts/needs-provider-check.sh decides whether the change touches an input of the Go
# checks or the generated SDK, and the job runs them and the SDK check only then. A failed
# decision or a failed check fails the job.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # the gitleaks action comments findings on the PR, which needs write on pull-requests
    permissions:
      contents: read
      pull-requests: write
    env:
      LEFTHOOK: 0
    steps:
      # the full history, for gitleaks' commit range and the provider decision's merge base
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # a pull request compares its base with the merge commit under test; a push compares the
      # commit before it (all zeros for a new branch, which needs the checks)
      - name: Decide whether the change needs the provider checks
        id: decide
        env:
          BASE:
            ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha ||
            github.event.before }}
        run: |
          needed="$(bun run --silent ci:needs-provider-check "$BASE" "$GITHUB_SHA")"
          case "$needed" in
            true | false) echo "provider=$needed" >> "$GITHUB_OUTPUT" ;;
            *) echo "unexpected decision: $needed" >&2; exit 1 ;;
          esac

      - name: Install
        run: bun install --frozen-lockfile

      - name: Format
        run: bun run format:check

      - name: Lint
        run: bun run lint:full

      - name: Doc links
        run: bash .claude/skills/docs-writing/scripts/check-links.sh

      # Some READMEs and docs/ pages fail the shared length or prose rules, so this step reports
      # its findings without failing the run.
      - name: Doc length and prose
        continue-on-error: true
        run: bash .claude/skills/docs-writing/scripts/check-length.sh

      - name: Pulumi pins
        run: bun run check:pulumi-pins

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      # bash, git, jq, openssl, curl, python3, coreutils and gh, all on ubuntu-latest's image;
      # the ubuntu-24.04 image 20260927.320.1 readme lists GitHub CLI 2.101.0, which the GitHub
      # API stand-in's real-gh case (scripts/test-lib/test-start-stub-github-api.sh) runs
      - name: Test Scripts
        run: bun run test:scripts

      - name: Dead Code
        run: bun run deadcode

      # last, because the action leaves results.sarif in the checkout, which the format check
      # would flag; it runs even after a failed check, so every run still scans for secrets
      - name: Gitleaks
        if: ${{ !cancelled() }}
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1

      - name: Report the skipped provider checks
        if: steps.decide.outputs.provider == 'false'
        run:
          echo "No input of the provider checks changed, so the Go checks did not run." | tee -a
          "$GITHUB_STEP_SUMMARY"

      # go.sum sits in provider/, not at the root, so the cache needs its path to find its key
      - name: Setup Go
        if: steps.decide.outputs.provider == 'true' && hashFiles('provider/go.mod') != ''
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: provider/go.mod
          # tools.sum holds the linters check.sh runs with go tool
          cache-dependency-path: |
            provider/go.sum
            provider/tools.sum

      - name: Provider checks
        if: steps.decide.outputs.provider == 'true'
        run: bun run provider:check

      # the Pulumi CLI at infra's @pulumi/pulumi pin, so the SDK check has no pin of its own;
      # the tarball is checked against the release's checksum file
      - name: Setup Pulumi CLI
        if: steps.decide.outputs.provider == 'true'
        run: |
          version="$(jq -r '.dependencies["@pulumi/pulumi"]' infra/package.json)"
          base="https://get.pulumi.com/releases/sdk"
          cd "$RUNNER_TEMP"
          curl -fsSLO "$base/pulumi-v$version-linux-x64.tar.gz"
          curl -fsSL "$base/pulumi-$version-checksums.txt" |
            grep " pulumi-v$version-linux-x64.tar.gz\$" | sha256sum -c -
          tar -xzf "pulumi-v$version-linux-x64.tar.gz"
          echo "$RUNNER_TEMP/pulumi" >> "$GITHUB_PATH"

      - name: SDK check
        if: steps.decide.outputs.provider == 'true'
        run: bun run check:sdk
