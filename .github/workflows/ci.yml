name: CI

# One job, checks, for the secret scan, the Bun checks, the provider's Go checks and the Docker
# lanes, so a run bills one runner minute where a job per check billed one each. The job runs on
# every pull request and every push to main, and the ruleset requires it.
# scripts/run-decide-gates.ts decides, from the gates of .github/gates.yml, whether the change
# touches an input of the Go checks and the SDK check, an input of each lane, and any file other
# than Markdown, which the four Nix-image linters and the shell suites need; the job runs each only
# then. A failed decision or a failed check fails the job.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels the CI run of its earlier head, and a new push to main
# cancels main's earlier run. The next run's path gates compare with main's last green commit, so
# it checks the cancelled run's changes too. Deploy prod applies every Pulumi input from the
# deployed/prod tag up to the commit whose run passed, so the next run's apply holds a cancelled
# run's change, and Deploy prod's own deploy-prod group never cancels an apply in progress.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # the gitleaks action comments findings on the PR, which needs write on pull-requests; the
    # image pin check reads the private ghcr.io/zgeoff packages, which needs read on packages; a
    # push lists CI's green runs on main, which needs read on actions
    permissions:
      actions: read
      contents: read
      packages: read
      pull-requests: write
    env:
      LEFTHOOK: 0
    steps:
      # the full history, for gitleaks' commit range and the provider decision's merge base
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # a pull request compares its base with the merge commit under test; a push compares main's
      # last green commit, which it asks the GitHub API for
      - name: Decide which checks the change needs
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          HEAD: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          bun run --silent ci:decide-ci-gates provider full agent-image atc-gateway files-image
          files-backup nixie-backup

      - name: Install
        run: bun install --frozen-lockfile

      - name: Format
        run: bun run format:check

      - name: Lint
        run: bun run lint:full

      # the four linters run tools from nixos/flake.lock's nixpkgs in the pinned Nix image; the
      # first one fills the job's Nix store volume for the others
      - name: Lint shell
        if: steps.decide.outputs.full == 'true'
        run: bun run lint:sh

      - name: Lint Nix
        if: steps.decide.outputs.full == 'true'
        run: bun run lint:nix

      - name: Lint Python
        if: steps.decide.outputs.full == 'true'
        run: bun run lint:py

      # actionlint, then the check that every run step is setup or one bun run call, then the check
      # that a push to main cancels main's earlier CI run and never a Deploy prod apply
      - name: Lint Actions
        if: steps.decide.outputs.full == 'true'
        run: bun run lint:actions

      - name: Doc links
        run: bun run check:doc-links

      # Some READMEs and docs/ pages fail the shared length or prose rules, so this step reports
      # its findings without failing the run.
      - name: Doc length and prose
        continue-on-error: true
        run: bun run check:doc-length

      - name: Pulumi pins
        run: bun run check:pulumi-pins

      # the copies of shared constants that stay outside packages/topology agree with it
      - name: Topology
        run: bun run check:topology

      # each release tag still names its pinned digest, and each upstream digest is still served
      - name: Image pins
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run check:image-pins

      # each release registry pin in the checkout holds what the pin table holds
      - name: Release pins
        run: bun run check:release-pins

      # each restore Job's YAML is its backup pod builder's output
      - name: Restore jobs
        run: bun run check:restore-job

      - name: Typecheck
        run: bun run typecheck

      # the Pulumi CLI at infra's @pulumi/pulumi pin, with the Kubernetes plugin at infra's pin,
      # for the port-forward guard's preview test and the SDK check; the tarball is checked
      # against the release's checksum file
      - name: Setup Pulumi CLI
        run: bun run ci:install-pulumi-cli

      - name: Test
        run: bun run test

      - name: Test Health Check
        run: bun run test:health-check

      - name: Test Preview
        run: bun run test:preview

      - name: Test Files
        run: bun run test:files

      # bash, git, jq, openssl, curl, python3, coreutils, dpkg-deb and gh, all on ubuntu-latest's
      # image; CI=true there, so the apt stand-in's suite fails rather than skip without dpkg-deb;
      # the ubuntu-24.04 image 20260927.320.1 readme lists GitHub CLI 2.101.0, which the GitHub
      # API stand-in's real-gh case (test-support/shell/test-start-stub-github-api.sh) runs
      - name: Test Scripts
        if: steps.decide.outputs.full == 'true'
        run: bun run test:scripts

      # the pinned blackbox exporter and promtool in Docker, against the probe and the rules the
      # repo builds, so a body with failing turns fires NixieTurnsFailing and a clear one does not
      - name: Test Alert Rules
        run: bun run test:alert-rules

      # The lanes: each Docker suite runs only when its gate says the change touches its inputs.
      # A push to main runs the atc gateway's fixture and the files image's test in their publish
      # workflows, before they publish, so this job runs those two on a pull request only.
      - name: Test Agent Image
        if: steps.decide.outputs.agent-image == 'true'
        run: bun run test:agent-image

      - name: Test atc Gateway Fixture
        if: github.event_name == 'pull_request' && steps.decide.outputs.atc-gateway == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun run test:atc-gateway-fixture

      - name: Test Files Image
        if: github.event_name == 'pull_request' && steps.decide.outputs.files-image == 'true'
        run: bun run test:files-image

      # the backup images are private GHCR packages, so docker pulls them with the workflow token
      - name: Log in to GHCR
        if: >-
          steps.decide.outputs.files-backup == 'true' || steps.decide.outputs.nixie-backup == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run login:ghcr

      - name: Test Files Backup Fixture
        if: steps.decide.outputs.files-backup == 'true'
        run: bun run test:files-backup-fixture

      - name: Test nixie Backup Fixture
        if: steps.decide.outputs.nixie-backup == 'true'
        run: bun run test:nixie-backup-fixture

      - name: Dead Code
        run: bun run deadcode

      # last, because the action leaves results.sarif in the checkout, which the format check
      # would flag; it runs even after a failed check, so every run still scans for secrets
      - name: Gitleaks
        if: ${{ !cancelled() }}
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1

      # go.sum sits in provider/, not at the root, so the cache needs its path to find its key
      - name: Setup Go
        if: steps.decide.outputs.provider == 'true' && hashFiles('provider/go.mod') != ''
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: provider/go.mod
          # tools.sum holds the linters check.sh runs with go tool
          cache-dependency-path: |
            provider/go.sum
            provider/tools.sum

      - name: Provider checks
        if: steps.decide.outputs.provider == 'true'
        run: bun run provider:check

      - name: SDK check
        if: steps.decide.outputs.provider == 'true'
        run: bun run check:sdk
