name: NixOS checks

# Builds the NixOS flake's checks, including the impd restore rehearsals, which boot VMs and
# need KVM on the runner. The workflow runs on every pull request and every push to main, so the
# nixos job always reports a result; scripts/needs-nixos-checks.sh decides whether the change
# touches an input of the checks, and the job builds them only then. A failed decision or a
# failed check fails the job.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  nixos:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # the full history, so the decision can find the merge base with the pull request's base
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # a pull request compares its base with the merge commit under test; a push compares the
      # commit before it (all zeros for a new branch, which needs the checks)
      - name: Decide whether the change needs the checks
        id: decide
        env:
          BASE:
            ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha ||
            github.event.before }}
        run: |
          needed="$(bun run --silent ci:needs-nixos-checks "$BASE" "$GITHUB_SHA")"
          case "$needed" in
            true | false) echo "needed=$needed" >> "$GITHUB_OUTPUT" ;;
            *) echo "unexpected decision: $needed" >&2; exit 1 ;;
          esac

      - name: Report the skipped checks
        if: steps.decide.outputs.needed == 'false'
        run:
          echo "No input of the NixOS checks changed, so the checks did not run." | tee -a
          "$GITHUB_STEP_SUMMARY"

      # the runner has /dev/kvm, but QEMU, which runs as a nixbld user in the nixos/nix
      # container, got "Permission denied" on it and fell back to emulation; this rule opens it
      # to every user, as GitHub's changelog of 2024-04-02 documents for the hosted Linux runners
      - name: Open /dev/kvm to QEMU
        if: steps.decide.outputs.needed == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: NixOS checks
        if: steps.decide.outputs.needed == 'true'
        run: bun run test:nixos
