name: NixOS checks

# Builds the NixOS flake's checks, including the impd restore rehearsals, which boot VMs and
# need KVM on the runner. The checks gate the host switch, not the merge:
# scripts/switch-geoffcloud.sh refuses a commit that no green scheduled or dispatched run on main
# covers (scripts/find-nixos-check-run.sh). So the workflow runs:
#
# - nightly on main;
# - on workflow_dispatch on main, at the commit to switch to;
# - on workflow_dispatch on a pull request's head branch with its number, once its CI passed on
#   the head it merges: the run checks the pull request's merge commit, and the switch gate,
#   which reads only main's runs, never counts it (scripts/check-nixos-checks-dispatch.sh).
#
# A run builds nothing, and passes, when a green run on main already covers the commit, which is
# when no input of the checks (the nixos gate of .github/gates.yml) changed since that run's
# commit, or when a run already built and passed the same derivations with the same build files
# (scripts/decide-nixos-checks-build.sh). A dispatch with force always builds. No pull_request
# event starts it.
#
# A build restores main's cache of the store paths that cache.nixos.org does not serve, and a
# build on main saves a new one and removes the older ones (scripts/write-nixos-checks-cache.sh,
# scripts/remove-stale-nixos-checks-caches.sh).
on:
  schedule:
    # 03:17 UTC: GitHub's docs say scheduled runs queue at the start of each hour, so off the hour
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description:
          Build the checks even when a green run covers the commit or built its derivations
        type: boolean
        default: false
      pull-request:
        description:
          On a pull request's head branch, its number; the run checks the pull request's merge
          commit
        type: string
        default: ''

permissions:
  contents: read
  actions: read

# Runs on one commit of main queue, so a later run finds the earlier one's result and builds
# nothing; main never cancels, since the switch gate reads every green run. A newer dispatch on a
# branch cancels the branch's older run, whose head is no longer the one to merge.
concurrency:
  group: nixos-checks-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  nixos:
    runs-on: ubuntu-latest
    # twice the checks' 60-minute test budget plus the job's median 0.13 minutes outside them,
    # rounded up; the budget holds every measured run, the slowest at 58.4 minutes
    timeout-minutes: 121
    # actions: write removes main's older store caches; checks and pull-requests read let the
    # dispatch check read a pull request and its CI checks
    permissions:
      contents: read
      actions: write
      checks: read
      pull-requests: read
    steps:
      # the full history, so a green run's commit can be compared with the commit under test; no
      # token stays in .git/config, so the checks, which run a dispatched branch's own code, never
      # read it: only the decision and cache steps get the token, through their own environment.
      # A pull request's run checks out its merge commit.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref:
            ${{ inputs.pull-request != '' && format('refs/pull/{0}/merge', inputs.pull-request) ||
            github.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # once per pull request, on the head it merges (docs/runbooks/ops.md)
      - name: Check the dispatch
        env:
          PULL_REQUEST: ${{ inputs.pull-request }}
          GH_TOKEN: ${{ github.token }}
          GH_TELEMETRY: '0'
          DO_NOT_TRACK: '1'
          GH_NO_UPDATE_NOTIFIER: '1'
        run: bun run --silent ci:check-nixos-checks-dispatch

      # a gh failure fails the job rather than skipping the checks
      - name: Decide whether a green run covers the commit
        id: decide
        env:
          FORCE: ${{ inputs.force }}
          GH_TOKEN: ${{ github.token }}
          GH_TELEMETRY: '0'
          DO_NOT_TRACK: '1'
          GH_NO_UPDATE_NOTIFIER: '1'
        run: bun run --silent ci:decide-nixos-checks

      - name: List the checks' derivations
        if: steps.decide.outputs.needed == 'true'
        env:
          DERIVATIONS: ${{ runner.temp }}/nixos-check-derivations
        run: bun run --silent test:nixos --derivations "$DERIVATIONS"

      - name: Decide whether a run built the same derivations
        id: build
        if: steps.decide.outputs.needed == 'true'
        env:
          FORCE: ${{ inputs.force }}
          DERIVATIONS: ${{ runner.temp }}/nixos-check-derivations
          GH_TOKEN: ${{ github.token }}
          GH_TELEMETRY: '0'
          DO_NOT_TRACK: '1'
          GH_NO_UPDATE_NOTIFIER: '1'
        run: bun run --silent ci:decide-nixos-checks-build "$DERIVATIONS"

      # the newest cache main saved; a branch reads main's caches, and never saves one
      - name: Restore the store cache
        if: steps.build.outputs.needed == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/nixos-checks-cache
          key: nixos-checks-store-main-${{ github.run_id }}
          restore-keys: nixos-checks-store-main-

      # the runner has /dev/kvm, but QEMU, which runs as a nixbld user in the nixos/nix
      # container, got "Permission denied" on it and fell back to emulation; this rule opens it
      # to every user, as GitHub's changelog of 2024-04-02 documents for the hosted Linux runners
      - name: Open /dev/kvm to QEMU
        if: steps.build.outputs.needed == 'true'
        run: bun run --silent ci:open-kvm

      # the derivations the listing step evaluated, so the flake is not evaluated twice; capped at a
      # private repo's standard runner (2 CPUs, 8 GB, of which the runner itself
      # takes about 1 GB), so the checks keep passing once the repo goes private
      - name: NixOS checks
        if: steps.build.outputs.needed == 'true'
        env:
          NIXOS_CHECKS_CPUS: '0-1'
          NIXOS_CHECKS_MEMORY: 7g
          NIXOS_CHECKS_CACHE: ${{ runner.temp }}/nixos-checks-cache
          DERIVATIONS: ${{ runner.temp }}/nixos-check-derivations
        run: bun run test:nixos --from-derivations "$DERIVATIONS"

      # the record a later run with the same key finds, so it skips the build
      - name: Record the derivations as built
        if: steps.build.outputs.needed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nixos-checks-${{ steps.build.outputs.key }}
          path: ${{ runner.temp }}/nixos-check-derivations
          retention-days: 90

      - name: Write the store cache
        id: cache
        if: steps.build.outputs.needed == 'true' && github.ref == 'refs/heads/main'
        env:
          DERIVATIONS: ${{ runner.temp }}/nixos-check-derivations
          RESTORED: ${{ runner.temp }}/nixos-checks-cache
          CACHE: ${{ runner.temp }}/nixos-checks-cache-new
        run: bun run --silent ci:write-nixos-checks-cache "$DERIVATIONS" "$RESTORED" "$CACHE"

      - name: Save the store cache
        if: steps.cache.outputs.saved == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/nixos-checks-cache
          key: nixos-checks-store-main-${{ github.run_id }}

      - name: Remove main's older store caches
        if: steps.cache.outputs.saved == 'true'
        env:
          KEPT: nixos-checks-store-main-${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
          GH_TELEMETRY: '0'
          DO_NOT_TRACK: '1'
          GH_NO_UPDATE_NOTIFIER: '1'
        run: bun run --silent ci:remove-stale-nixos-checks-caches "$KEPT"
