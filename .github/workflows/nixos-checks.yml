name: NixOS checks

# Builds the NixOS flake's checks, including the impd restore rehearsals, which boot VMs and
# need KVM on the runner. The checks gate the host switch, not the merge:
# scripts/switch-geoffcloud.sh refuses a commit that no green scheduled or dispatched run on main
# covers (scripts/find-nixos-check-run.sh). So the workflow runs:
#
# - nightly on main, building the checks only when no green run covers the commit yet, which is
#   when an input of the checks (scripts/needs-nixos-checks.sh) changed since the last one;
# - on workflow_dispatch, always building them, on main before a switch or on a branch;
# - on a pull request that an app opened and that touches nixos/ or packages/topology/, such as
#   a release check's imp or host atc bump, so the workflow that merges the bump can wait for a
#   green run. The ruleset does not require this check. A person's pull request skips the job;
#   the nightly run checks it once it lands.
on:
  schedule:
    # 03:17 UTC: GitHub's docs say scheduled runs queue at the start of each hour, so off the hour
    - cron: '17 3 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'nixos/**'
      - 'packages/topology/**'

permissions:
  contents: read
  actions: read

jobs:
  nixos:
    if: github.event_name != 'pull_request' || github.event.pull_request.user.type == 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # the full history, so a green run's commit can be compared with the commit under test; no
      # token stays in .git/config, so the checks, which run a pull request's own code, never read
      # it: only the decision step gets the token, through its own environment
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # a nightly run skips a commit a green run already covers; a dispatch and an app's pull
      # request always build. A gh failure fails the job rather than skipping the checks.
      - name: Decide whether the commit needs the checks
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          GH_TELEMETRY: '0'
          DO_NOT_TRACK: '1'
          GH_NO_UPDATE_NOTIFIER: '1'
        run: bun run --silent ci:decide-nixos-checks

      # the runner has /dev/kvm, but QEMU, which runs as a nixbld user in the nixos/nix
      # container, got "Permission denied" on it and fell back to emulation; this rule opens it
      # to every user, as GitHub's changelog of 2024-04-02 documents for the hosted Linux runners
      - name: Open /dev/kvm to QEMU
        if: steps.decide.outputs.needed == 'true'
        run: bun run --silent ci:open-kvm

      # capped at a private repo's standard runner (2 CPUs, 8 GB, of which the runner itself
      # takes about 1 GB), so the checks keep passing once the repo goes private
      - name: NixOS checks
        if: steps.decide.outputs.needed == 'true'
        env:
          NIXOS_CHECKS_CPUS: '0-1'
          NIXOS_CHECKS_MEMORY: 7g
        run: bun run test:nixos
