name: Deploy prod

# Applies main to the prod stack with no person involved, unless the guard holds it. It starts
# when the CI run of a push to main passes, and does nothing unless a Pulumi input changed since
# the deployed/prod tag. It checks drift from that tag, previews the push's commit, and applies
# only when the guard passes the plan; then it checks drift again and moves the tag. A held plan
# waits for a manual dispatch of this workflow on main, which applies whatever the guard found.
# docs/runbooks/workflows.md covers a held run and the tag's first setting.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      revision:
        description: The full commit of the held run to apply; it must be main's tip
        required: true
        type: string

permissions:
  contents: read

# The concurrency groups sit on the jobs, not here, so a run that decide filters out never joins
# one and never takes the place of a decision or an apply that waits.
jobs:
  # Decides from the repo alone, with no secret, whether the commit needs an apply. A CI run of a
  # pull request, a fork or a failed check starts nothing.
  decide:
    if: >-
      github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # One decision at a time, so the runs' applies join the deploy-prod group in the order the runs
    # started. queue: max keeps every waiting decision, in the order each began to wait, so a run
    # that starts later, such as an older commit's whose CI finished last, never replaces a waiting
    # one. actionlint 1.7.12 rejects the queue key, so .github/actionlint.yaml ignores that error.
    concurrency:
      group: deploy-prod-decide
      cancel-in-progress: false
      queue: max
    # actions: read lists CI's runs for a dispatch
    permissions:
      contents: read
      actions: read
    outputs:
      apply: ${{ steps.decide.outputs.apply }}
      revision: ${{ steps.decide.outputs.revision }}
    env:
      LEFTHOOK: 0
      EVENT: ${{ github.event_name }}
      RUN_HEAD: ${{ github.event.workflow_run.head_sha }}
      DISPATCH_REF: ${{ github.ref }}
      DISPATCH_SHA: ${{ github.sha }}
      DISPATCH_REVISION: ${{ inputs.revision }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # the full history and tags, for the deployed/prod tag and the comparison with it
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # a dispatch applies main's tip, only when the person named it and only after CI passed on
      # it, since a dispatch skips the trigger that waits for CI; a CI run applies the commit it
      # checked, which must be on main. The apply job decides again against the tag it finds.
      - name: Decide whether the commit needs an apply
        id: decide
        run: bun run --silent ci:decide-prod-apply

  apply:
    needs: decide
    if: needs.decide.outputs.apply == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: prod
    # One apply at a time, and never cancel one in progress: a cancelled apply leaves the stack half
    # changed. queue: max keeps every waiting apply, up to GitHub's 100, and starts them in the
    # order each began to wait, so no apply takes the place of another. The group sits after
    # decide's filter, so a failed CI run, a pull request's run or a commit with nothing to apply
    # never joins it. The job decides again once it holds the group, so an older commit's apply
    # that starts after a newer commit's finds nothing left to do, and the tag only moves forward.
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
      queue: max
    outputs:
      verdict: ${{ steps.guard.outputs.verdict }}
    # contents: write moves the deployed/prod tag; id-token: write joins the tailnet through the
    # federated identity
    permissions:
      contents: write
      id-token: write
    env:
      LEFTHOOK: 0
      REVISION: ${{ needs.decide.outputs.revision }}
      PULUMI_SKIP_UPDATE_CHECK: true
    # Every step after the queued decision runs only when it finds the revision still needs the
    # apply.
    steps:
      # fetched after the job took the group, so the deployed/prod tag is the one the last apply
      # left
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.decide.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Decide again against the deployed revision
        id: queued
        run: bun run --silent ci:decide-queued-prod-apply

      # the job's service account reads only the cloud-deploy vault
      - name: Point .env at the deploy vault
        if: steps.queued.outputs.apply == 'true'
        run: bun run ci:write-deploy-env .env

      # go.sum sits in provider/, not at the root, so the cache needs its path to find its key
      - name: Setup Go
        if: steps.queued.outputs.apply == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: provider/go.mod
          cache-dependency-path: provider/go.sum

      # the CLI release that matches the program's @pulumi/pulumi
      - name: Setup Pulumi
        if: steps.queued.outputs.apply == 'true'
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
        with:
          pulumi-version: 3.264.0

      - name: Setup 1Password CLI
        if: steps.queued.outputs.apply == 'true'
        uses: 1password/install-cli-action@1a3160d5e9de1ae0803eaa08a88746f5ae3daa50 # v4.1.0
        with:
          version: 2.40.0

      # an ephemeral node, tagged tag:cloud-deploy, that reaches only k3s's API on geoffcloud
      - name: Join the tailnet
        if: steps.queued.outputs.apply == 'true'
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ vars.TS_DEPLOY_CLIENT_ID }}
          audience: ${{ vars.TS_DEPLOY_AUDIENCE }}
          tags: tag:cloud-deploy

      # a new node reaches its peers only once the tailnet has spread its key; any HTTP answer,
      # a 401 included, shows the route is open
      - name: Wait for the k3s API
        if: steps.queued.outputs.apply == 'true'
        run: bun run ci:wait-for-k3s-api

      - name: Install
        if: steps.queued.outputs.apply == 'true'
        run: bun install --frozen-lockfile

      - name: Check out the deployed revision
        if: steps.queued.outputs.apply == 'true'
        env:
          DEPLOYED: ${{ steps.queued.outputs.deployed }}
        run: bun run ci:check-out-deployed-revision

      # a failure here holds the apply rather than failing the run, so the plan still shows
      - name: Check drift from the deployed revision
        id: drift
        if: steps.queued.outputs.apply == 'true'
        continue-on-error: true
        working-directory: ${{ runner.temp }}/deployed
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: bun run drift -- --suppress-outputs

      # the digest stays on the runner: the guard prints each held step's op and URN, never a
      # resource's state
      - name: Preview and guard
        id: guard
        if: steps.queued.outputs.apply == 'true'
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          DRIFT: ${{ steps.drift.outcome }}
        run: bun run --silent ci:preview-and-guard-prod

      - name: Hold for a manual dispatch
        if: >-
          steps.queued.outputs.apply == 'true' && steps.guard.outputs.verdict == 'hold' &&
          github.event_name != 'workflow_dispatch'
        run: bun run ci:hold-prod-apply "$REVISION"

      - name: Apply
        if: >-
          steps.queued.outputs.apply == 'true' && (steps.guard.outputs.verdict == 'apply' ||
          github.event_name == 'workflow_dispatch')
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: bun run up -- --yes --refresh --skip-preview --suppress-outputs

      - name: Check drift after the apply
        if: steps.queued.outputs.apply == 'true'
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: bun run drift -- --suppress-outputs

      # force=false refuses a move that is not forward along main
      - name: Move deployed/prod
        if: steps.queued.outputs.apply == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun run ci:move-deployed-prod "$REVISION"

  alert:
    needs: [decide, apply]
    if: >-
      always() && (needs.decide.result == 'failure' || needs.apply.result == 'failure' ||
      needs.apply.result == 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: prod
    env:
      VERDICT: ${{ needs.apply.outputs.verdict }}
      EVENT: ${{ github.event_name }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Point .env at the deploy vault
        run: bun run ci:write-deploy-env .env

      - name: Setup 1Password CLI
        uses: 1password/install-cli-action@1a3160d5e9de1ae0803eaa08a88746f5ae3daa50 # v4.1.0
        with:
          version: 2.40.0

      - name: Alert on Discord
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: bun run ci:alert-prod-apply .env
