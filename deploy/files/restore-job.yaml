# Generated by `bun run write:restore-job` from the backup pod in
# infra/cluster/build-files-backup-pod-spec.ts and the stack config's atcGateway.backupImage: never
# edit it by hand. `bun run check:restore-job` fails when it differs.
#
# One-off restore of the files service's volume, from the files-backup CronJob's repository. Stop
# the service first (docs/runbooks/files.md), then:
#   ssh root@geoffcloud k3s kubectl create -f - < deploy/files/restore-job.yaml
# To list the snapshots instead, set args to ['ls']; to restore another snapshot, set SNAPSHOT. The
# claim is data-files-0, the service's own. The script and the Secret come from the CronJob's
# fixed-name ConfigMap and Secret.
apiVersion: batch/v1
kind: Job
metadata:
  generateName: files-restore-
  namespace: files
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: restore
          image: ghcr.io/zgeoff/atc-gateway-backup:2.24.0-r2@sha256:ac47d4a0409e81be7304c46372f2d855083cd45315fe30529dc3279ccae9f377
          command:
            - /bin/sh
            - /opt/files-backup/backup.sh
          args:
            - restore
          env:
            - name: STATE_DIR
              value: /state
            - name: HOME
              value: /tmp
            - name: SNAPSHOT
              value: latest
          envFrom:
            - secretRef:
                name: files-backup
          volumeMounts:
            - name: state
              mountPath: /state
            - name: script
              mountPath: /opt/files-backup
              readOnly: true
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: data-files-0
        - name: script
          configMap:
            name: files-backup-script
        - name: tmp
          emptyDir: {}
