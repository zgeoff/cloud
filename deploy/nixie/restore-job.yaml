# Generated by `bun run write:restore-job` from the restore pod in
# infra/cluster/build-nixie-restore-pod-spec.ts and the stack config's atcGateway.backupImage: never
# edit it by hand. `bun run check:restore-job` fails when it differs.
#
# One-off restore of nixie's data, from the nixie-backup CronJob's repository: restic restores the
# snapshot, and nixie's own restore command replaces nixie.db and keys.db with it. Stop nixie first
# and create the Job with nixie's image in place of NIXIE_IMAGE (docs/runbooks/nixie-backup.md).
# To list the snapshots instead, set the fetch container's args to ['ls'], and nixie's restore then
# finds no backup and changes nothing; to restore another snapshot, set SNAPSHOT. The claim is
# data-nixie-0, nixie's own; the restore test swaps in its scratch claim, nixie-restore-check. The
# script, nixie's config and the Secret come from the CronJob's fixed-name ConfigMaps and Secret.
apiVersion: batch/v1
kind: Job
metadata:
  generateName: nixie-restore-
  namespace: nixie
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      initContainers:
        - name: fetch
          image: ghcr.io/zgeoff/atc-gateway-backup:2.24.0-r2@sha256:ac47d4a0409e81be7304c46372f2d855083cd45315fe30529dc3279ccae9f377
          command:
            - /bin/sh
            - /opt/nixie-backup/backup.sh
          args:
            - restore
          env:
            - name: HOME
              value: /tmp
            - name: SNAPSHOT
              value: latest
          envFrom:
            - secretRef:
                name: nixie-backup
          volumeMounts:
            - name: script
              mountPath: /opt/nixie-backup
              readOnly: true
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      containers:
        - name: restore
          image: NIXIE_IMAGE
          command:
            - nixie
            - restore
            - '--from'
            - /tmp/nixie-backup
            - '--yes'
          volumeMounts:
            - name: state
              mountPath: /data
            - name: config
              mountPath: /etc/nixie/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: data-nixie-0
        - name: config
          configMap:
            name: nixie-backup-config
        - name: script
          configMap:
            name: nixie-backup-script
        - name: tmp
          emptyDir: {}
