    aion-3-5:
      base_url: https://openrouter.ai
      credential: deployment:openrouter
      auth_header: bearer
      model: aion-labs/aion-3.5
      effort: medium
      harness: agent-sdk
      outside_claude: true
      provider_pin: aion-labs
      context_tokens: 200000
      prices:
        input: 3
        cache_write: 3
        cache_write_1h: 3
        cached_input: 0.75
        output: 6
    # Codex tasks on the owner's ChatGPT plan login, selectable for a task. Its requests go through
    # the model gateway's plan route of the same ID (services.model-gateway in
    # nixos/hosts/geoffcloud/configuration.nix), which holds the login and sets its token on each
    # request. Its model secret in impd holds the route key, not a model credential
    # (docs/runbooks/model-gateway.md#add-the-chatgpt-plan-route). The prices equal the route's:
    # OpenAI's API prices for the model, which the spending stop counts.
    gpt-6-luna:
      harness: codex
      base_url: https://chatgpt.com
      credential: deployment:gpt-6-luna
      chatgpt_login: true
      model: gpt-6-luna
      effort: medium
      prices:
        input: 0.1
        cache_write: 0.125
        cache_write_1h: 0.125
        cached_input: 0.01
        output: 0.5
        long_prompt:
          over_tokens: 272000
          input: 0.2
          cache_write: 0.25
          cache_write_1h: 0.25
          cached_input: 0.02
          output: 0.75
  roles:
    conversation: fable-5-2
    checker: sonnet-5-5-high
    # the profile that runs a worker.run; it needs prices, because a worker run counts its cost
    # against its dollar limit. The worker run limits keep nixie's defaults (10 minutes, $2)
    worker: sonnet-5-5
  # the models a started task can choose in place of the task role's profile; the conversation sees
  # each name and its description
  selectable:
    haiku-5-5:
      profile: haiku-5-5
      description:
        Claude Haiku 5.5, released October 2026. Small, quick and almost free. Good for a fast
        answer, a quick check or a light chat.
    sonnet-5-5:
      profile: sonnet-5-5
      description:
        Claude Sonnet 5.5, released September 2026. Quick and sharp. A good second mind for most
        conversations, at a fraction of the cost of a larger model.
    opus-5-5:
      profile: opus-5-5
      description:
        Claude Opus 5.5, released September 2026. Good for a second opinion or a longer
        conversation.
    opus-4-5:
      profile: opus-4-5
      description:
        Claude Opus 4.5, released November 2025. An Opus from an earlier generation. Talk with it to
        hear how an older Claude sees something.
    opus-4-6:
      profile: opus-4-6
      description:
        Claude Opus 4.6, released February 2026. An Opus from an earlier generation. Talk with it to
        hear how an older Claude sees something.
    fable-5-1:
      profile: fable-5-1
      description:
        Claude Fable 5.1, released August 2026. The Fable before 5.2, and one of the most expensive
        models here. Talk with it to hear how the earlier Fable sees something.
    fable-5-2:
      profile: fable-5-2
      description:
        Claude Fable 5.2, released November 2026. Anthropic's newest Fable, and one of the most
        expensive models here. For a hard question, or a conversation that deserves the deepest
        thought.
    gemini-4-carbon:
      profile: gemini-4-carbon
      description:
        Google's Gemini 4 Carbon, released November 2026, through OpenRouter. A frontier Gemini for
        coding, agentic work and complex reasoning.
    gpt-6-2-sol:
      profile: gpt-6-2-sol
      description:
        OpenAI's GPT-6.2 Sol, released November 2026, through OpenRouter. The efficient, versatile
        tier below GPT-6.2 Astra, for everyday work.
    kimi-k3-1-pro:
      profile: kimi-k3-1-pro
      description:
        Moonshot AI's Kimi K3.1 Pro, released October 2026, through OpenRouter. An open-weight
        reasoning model built for long-horizon coding.
    glm-5-3:
      profile: glm-5-3
      description:
        Z.ai's GLM-5.3, released August 2026, through OpenRouter. A large reasoning model for
        complex software engineering and long agent tasks.
    grok-4-7:
      profile: grok-4-7
      description:
        SpaceXAI's Grok 4.7, released September 2026, through OpenRouter. A flagship for coding and
        knowledge work, strong at long software tasks and checking its own work.
    qwen4-max:
      profile: qwen4-max
      description:
        Alibaba's Qwen4 Max, released November 2026, through OpenRouter. The flagship of the Qwen4
        series, with reasoning on by default.
    mistral-large-4:
      profile: mistral-large-4
      description:
        Mistral AI's Mistral Large 4, released October 2026, through OpenRouter. A frontier model
        for reasoning, coding and agentic work.
    inkling-2-small:
      profile: inkling-2-small
      description:
        Thinking Machines Lab's Inkling 2 Small, released November 2026, through OpenRouter. A
        small, cheap open-weight reasoning model.
    deepseek-v4-1-flash:
      profile: deepseek-v4-1-flash
      description:
        DeepSeek V4.1 Flash, the 17 October 2026 snapshot, through OpenRouter. A fast, almost free
        mixture-of-experts model.
    gpt-6-2-astra:
      profile: gpt-6-2-astra
      description:
        OpenAI's GPT-6.2 Astra, released November 2026, through OpenRouter. OpenAI's flagship for
        the hardest engineering, professional and scientific work.
    gemini-4-hydrogen:
      profile: gemini-4-hydrogen
      description:
        Google's Gemini 4 Hydrogen, released November 2026, through OpenRouter. The quicker, cheaper
        Gemini 4 for agentic work and coding.
    muse-wonder:
      profile: muse-wonder
      description:
        Meta's Muse Wonder, released October 2026, through OpenRouter. A frontier reasoning model
        for complex personal and professional tasks.
    hy4:
      profile: hy4
      description:
        Tencent's Hy4, released November 2026, through OpenRouter. Strong at agentic, long-horizon
        productivity tasks.
    pareto-26-10:
      profile: pareto-26-10
      description:
        Unbiased's Pareto 26.10, released October 2026, through OpenRouter. A composite model for
        research, coding and agentic work.
    aion-3-5:
      profile: aion-3-5
      description:
        AionLabs' Aion 3.5, released September 2026, through OpenRouter. A roleplay and storytelling
        system built on GLM, for fiction and character voices.
    gpt-6-luna:
      profile: gpt-6-luna
      description:
        OpenAI's GPT-6 Luna in Codex, on the owner's ChatGPT plan. A coding agent for work in code
        and files.
  # a started task's dollar limits; nixie's defaults are $2 and $10, which Fable 5.1 spends in a few
  # turns. The turn limits keep nixie's defaults of 25 and 100
  limits:
    taskRun:
      default: { dollars: 5 }
      max: { dollars: 25 }
    # the spending stop's limits, nixie's defaults. The model gateway on the host caps the dollars
    # and tokens at twice these (services.model-gateway in nixos/hosts/geoffcloud/configuration.nix);
    # turnCap is the most today's turns can reach with a raise from the client
    day: { dollars: 60, tokens: 80000000, turns: 1000, turnCap: 2000 }
    month: { dollars: 600, tokens: 600000000, turns: 20000 }
definitions:
  source:
    kind: path
    # git-sync's link to its newest checkout of zgeoff/nixie-definitions' `live` branch
    path: /etc/nixie/definitions/current
  # nixie opens a pull request here for each skill it writes, with the token in the sops file
  export:
    repository: zgeoff/nixie-definitions
# the SHA-256, in hex, of each API token that nixie answers only read procedures for. The one token
# is the prod check's, in 1Password vault `nixie`, item `nixie-prod-read-token`.
api:
  read_only_token_hashes:
    - 96fe0c2a5f7e772c5fd3a6db1a5d2f83bdea79de978eec4fd864b0ef81e6cf7a
# the owner's name, which the conversation reads in place of "the owner", and the owner's pronouns
# for the review sentences; both stay out of this public file, in the sops file's settings
owner:
  name: deployment:owner_name
  pronouns:
    they: deployment:owner_pronoun_they
    their: deployment:owner_pronoun_their
# the names the owner calls the agent by
agent:
  names:
    - Nix
    - Nixie

# web search through Kagi: the key is the sops file's connector_credentials entry kagi, and nixie
# refuses a search past the daily cap, counted from midnight in time.default_zone (nixie's
# default, Australia/Sydney; this file sets no time section), not the pod's UTC clock
search:
  credential: deployment:kagi
  daily_call_cap: 200

# image tools: image.draw and its siblings exist only with this block. Each credential is the sops
# file's connector_credentials entry of that name. Prices are micros per image for each size, from
# the providers' pricing pages (read 22 Nov 2026), and the draw charge reads them.
# - gemini: Nano Banana 2.1 at 1K, which the adapter always requests: $0.0336 per image, plus a
#   small margin for source and reference images on an edit
# - openai: gpt-image-2.6-flare at its default quality, priced at the high-quality output tokens
#   (1,756 at 1024x1024, 1,372 at the other two) at $30 per million, plus a margin for the prompt and
#   one source image on an edit. OpenAI publishes tokens and rates, not a per-image price
images:
  default: gemini
  profiles:
    gemini:
      provider: gemini
      model: gemini-nano-banana-2.1
      credential: deployment:gemini-images
      prices: { '1024x1024': 35000, '1536x1024': 35000, '1024x1536': 35000 }
    openai:
      provider: openai
      model: gpt-image-2.6-flare
      credential: deployment:openai-images
      prices: { '1024x1024': 62000, '1536x1024': 50000, '1024x1536': 50000 }

# backups: the nixie-backup CronJob uploads once a day (04:00), so nixie writes a set and expects
# its receipt on the same daily cadence; readiness reports backups unready past twice the interval
backup:
  interval_minutes: 1440
