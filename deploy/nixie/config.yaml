# nixie's deployment configuration, mounted read-only at /etc/nixie/config.yaml from a ConfigMap
# (infra/nixie.ts). nixie reads it once at start, and refuses a bad value. A release that does not
# know a key logs `config.unknown_key` and starts without it. The file holds no secret:
# `deployment:<name>` names an entry in the sops file beside it. infra adds the `imp` section,
# impd's URL and the host's addresses, and the `spendStop` section, the model gateway's addresses,
# from packages/topology (infra/shared/build-nixie-imp-config.ts and
# build-nixie-spend-stop-config.ts).
server:
  data_dir: /data
  hostname: 0.0.0.0
  port: 8080
  secrets_file: /etc/nixie/secrets.yaml
models:
  profiles:
    # A profile's ID names its model and, when a role needs another effort, that effort. Each profile
    # needs its own model secret in impd, whose name hashes the ID and the base URL's host
    # (docs/runbooks/nixie.md). A selectable model's profile needs prices, in dollars per million
    # tokens, from the Claude API pricing page for a Claude model. Each profile names its harness,
    # the loop that runs its turns, with no default: agent-sdk, or codex for gpt-6-luna below.
    #
    # the conversation's profile, also selectable for a task
    fable-5-2:
      base_url: https://api.anthropic.com
      credential: deployment:anthropic
      auth_header: bearer
      model: claude-fable-5-2
      effort: medium
      harness: agent-sdk
      # compact a long conversation at 400k tokens instead of near the full 1M window
      context_tokens: 400000
      # keep the cached prompt for an hour, for the conversation and for a task on this model; a
      # profile without cache_ttl keeps the 5m default
      cache_ttl: 1h
      prices: { input: 8, cache_write: 10, cache_write_1h: 16, cached_input: 0.2, output: 40 }
    # selectable for a task, compacted at 400k tokens with a 1-hour cache
    opus-5-5:
      base_url: https://api.anthropic.com
      credential: deployment:anthropic
      auth_header: bearer
      model: claude-opus-5-5
      effort: medium
      harness: agent-sdk
      context_tokens: 400000
      cache_ttl: 1h
      prices: { input: 4, cache_write: 5, cache_write_1h: 8, cached_input: 0.2, output: 20 }
    # Haiku at low effort; no role uses it since nixie 0.73.0 deleted the memory writer
    haiku-5-5-low:
      base_url: https://api.anthropic.com
      credential: deployment:anthropic
      auth_header: bearer
      model: claude-haiku-5-5
      effort: low
      harness: agent-sdk
    # the checker; high is Sonnet 5.5's default effort, and the schema needs a value
    sonnet-5-5-high:
      base_url: https://api.anthropic.com
      credential: deployment:anthropic
      auth_header: bearer
      model: claude-sonnet-5-5
      effort: high
      harness: agent-sdk
    haiku-5-5:
      base_url: https://api.anthropic.com
      credential: deployment:anthropic
      auth_header: bearer
      model: claude-haiku-5-5
      effort: medium
      harness: agent-sdk
      prices:
        input: 0.1
        cache_write: 0.125
        cache_write_1h: 0.2
        cached_input: 0.01
        output: 0.5
        # Haiku 5.5 prices a whole request at these rates once its prompt passes 100k tokens
        long_prompt:
          over_tokens: 100000
          input: 0.5
          cache_write: 0.625
          cache_write_1h: 1
          cached_input: 0.05
          output: 2.5
    sonnet-5-5:
      base_url: https://api.anthropic.com
      credential: deployment:anthropic
      auth_header: bearer
      model: claude-sonnet-5-5
      effort: medium
      harness: agent-sdk
      prices: { input: 2, cache_write: 2.5, cache_write_1h: 4, cached_input: 0.1, output: 10 }
    opus-4-5:
      base_url: https://api.anthropic.com
      credential: deployment:anthropic
      auth_header: bearer
      model: claude-opus-4-5
      effort: medium
      harness: agent-sdk
      prices: { input: 5, cache_write: 6.25, cache_write_1h: 10, cached_input: 0.5, output: 25 }
    opus-4-6:
      base_url: https://api.anthropic.com
      credential: deployment:anthropic
      auth_header: bearer
      model: claude-opus-4-6
      effort: medium
      harness: agent-sdk
      prices: { input: 5, cache_write: 6.25, cache_write_1h: 10, cached_input: 0.5, output: 25 }
    fable-5-1:
      base_url: https://api.anthropic.com
      credential: deployment:anthropic
      auth_header: bearer
      model: claude-fable-5-1
      effort: medium
      harness: agent-sdk
      prices: { input: 10, cache_write: 12.5, cache_write_1h: 20, cached_input: 0.25, output: 50 }
    # Models outside Claude, through OpenRouter's Messages endpoint. The model gateway's route of
    # each profile sends to https://openrouter.ai/api, since nixie refuses a base URL with a path
    # while spendStop is set. Each profile's model secret holds the OpenRouter key from vault cloud,
    # item nixie-openrouter-credential, for the host openrouter.ai (docs/runbooks/nixie.md).
    # Each profile pins one provider endpoint with fallbacks off, so OpenRouter never bills another
    # provider's price: a standard tier, never a fast, priority or flex one, at full or fp8 precision
    # where the model has such an endpoint, with full recent uptime. The gateway route's providerPin
    # names the same endpoint. For glm-5-3, kimi-k3-1-pro, mistral-large-4, inkling-2-small and
    # deepseek-v4-1-flash, the pin is the fastest endpoint by measured output speed (3 streamed
    # replies of 560 tokens each, 18 Nov 2026) among those within about 3x the cheapest one's price,
    # with 1-day uptime of at least 99.5%. A pin also matches the endpoints under it, such as another
    # region, and an open-weight model's priority endpoint (OpenRouter's provider selection guide),
    # so each price is the highest of the endpoints the pin matches, from
    # https://openrouter.ai/api/v1/models/<model>/endpoints (read 18 Nov 2026). An endpoint that lists
    # no cache write price bills cache writes as input, and a Gemini cache write costs the input price
    # plus the listed storage price. The cap of 200,000 tokens is the window the
    # Claude CLI assumes for a model outside its catalog. gryphe/mythomax-l2-13b stays out: its
    # 8,192-token window is below the 100,000-token floor of context_tokens, and it has no tool calls.
    # Google AI Studio, at the same price as Vertex's global endpoint, which ran below full uptime
    gemini-4-carbon:
      base_url: https://openrouter.ai
      credential: deployment:openrouter
      auth_header: bearer
      model: google/gemini-4-carbon
      effort: medium
      harness: agent-sdk
      outside_claude: true
      provider_pin: google-ai-studio
      context_tokens: 200000
      prices:
        input: 2
        cache_write: 2.1875
        cache_write_1h: 2.1875
        cached_input: 0.1
        output: 10
    gpt-6-2-sol:
      base_url: https://openrouter.ai
      credential: deployment:openrouter
      auth_header: bearer
      model: openai/gpt-6.2-sol
      effort: medium
      harness: agent-sdk
      outside_claude: true
      provider_pin: openai
      context_tokens: 200000
      prices:
        input: 2
        cache_write: 2.5
        cache_write_1h: 2.5
        cached_input: 0.1
        output: 10
        long_prompt:
          over_tokens: 272000
          input: 4
          cache_write: 5
          cache_write_1h: 5
          cached_input: 0.2
          output: 15
    # Fireworks, at Moonshot AI's own price: Moonshot AI serves the model only at mxfp4 precision
    kimi-k3-1-pro:
      base_url: https://openrouter.ai
      credential: deployment:openrouter
      auth_header: bearer
      model: moonshotai/kimi-k3.1-pro
      effort: medium
      harness: agent-sdk
      outside_claude: true
      provider_pin: fireworks
      context_tokens: 200000
      prices:
        input: 2
        cache_write: 2
        cache_write_1h: 2
        cached_input: 0.2
        output: 10
    glm-5-3:
      base_url: https://openrouter.ai
      credential: deployment:openrouter
      auth_header: bearer
      model: z-ai/glm-5.3
      effort: medium
      harness: agent-sdk
      outside_claude: true
      provider_pin: tenstorrent/fp8
      context_tokens: 200000
      prices:
        input: 0.6
        cache_write: 0.6
        cache_write_1h: 0.6
        cached_input: 0.1
        output: 2.5
    grok-4-7:
      base_url: https://openrouter.ai
      credential: deployment:openrouter
      auth_header: bearer
      model: x-ai/grok-4.7
      effort: medium
      harness: agent-sdk
      outside_claude: true
      provider_pin: xai
      context_tokens: 200000
      prices:
        input: 2.2
        cache_write: 2.2
        cache_write_1h: 2.2
        cached_input: 0.55
        output: 6.6
        long_prompt:
          over_tokens: 200000
          input: 4.4
          cache_write: 4.4
          cache_write_1h: 4.4
          cached_input: 1.1
          output: 13.2
    qwen4-max:
      base_url: https://openrouter.ai
      credential: deployment:openrouter
      auth_header: bearer
      model: qwen/qwen4-max
      effort: medium
      harness: agent-sdk
      outside_claude: true
      provider_pin: alibaba
      context_tokens: 200000
      prices:
        input: 1.425
        cache_write: 1.78125
        cache_write_1h: 1.78125
        cached_input: 0.07125
        output: 4.275
    mistral-large-4:
      base_url: https://openrouter.ai
      credential: deployment:openrouter
      auth_header: bearer
      model: mistralai/mistral-large-4-0
      effort: medium
      harness: agent-sdk
      outside_claude: true
      provider_pin: mistral/zdr
      context_tokens: 200000
      prices:
        input: 0.7
        cache_write: 0.7
        cache_write_1h: 0.7
        cached_input: 0.07
        output: 2.1
    inkling-2-small:
      base_url: https://openrouter.ai
      credential: deployment:openrouter
      auth_header: bearer
      model: thinkingmachines/inkling-2-small
      effort: medium
      harness: agent-sdk
      outside_claude: true
      provider_pin: together
      context_tokens: 200000
      prices:
        input: 0.3
