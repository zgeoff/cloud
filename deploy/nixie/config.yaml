# nixie's deployment configuration, mounted read-only at /etc/nixie/config.yaml from a ConfigMap
# (infra/nixie.ts). nixie reads it once at start and refuses an unknown key. It holds no secret:
# `deployment:<name>` names an entry in the sops file beside it.
server:
  data_dir: /data
  hostname: 0.0.0.0
  port: 8080
  secrets_file: /etc/nixie/secrets.yaml
models:
  profiles:
    opus:
      base_url: https://api.anthropic.com
      credential: deployment:anthropic
      auth_header: bearer
      model: claude-opus-5-5
      effort: medium
      # compact a long conversation at 400k tokens instead of near the full window
      context_tokens: 400000
    # the memory writer extracts and files memories from each batch of messages
    haiku:
      base_url: https://api.anthropic.com
      credential: deployment:anthropic
      auth_header: bearer
      model: claude-haiku-5-5
      effort: low
    # high is Sonnet 5.5's default effort, and the schema needs a value
    sonnet:
      base_url: https://api.anthropic.com
      credential: deployment:anthropic
      auth_header: bearer
      model: claude-sonnet-5-5
      effort: high
  roles:
    conversation: opus
    memory-writer: haiku
    checker: sonnet
imp:
  # impd's API on its own tailnet node; the pod reaches it through the host's node (tag:cloud)
  url: https://imps.geoff.cloud
  # impd's own IMP_HOST_ADDRESSES, which imp's module reads from the host's interfaces: public
  # egress needs them, and the web fetch tool refuses them
  host_addresses:
    - 104.250.100.18/24
    - 2401:a4a0:4:17f::1/64
    - 172.17.0.1/16
    - 100.69.47.33/32
    - fd7a:115c:a1e0::ca36:2f22/128
    - 10.42.0.0/32
    - 10.42.0.1/24
  # k3s's pod and service ranges, which imp's module drops from imp-host's bridge as well
  egress_deny:
    - 10.42.0.0/16
    - 10.43.0.0/16
definitions:
  source:
    kind: path
    # git-sync's link to its newest checkout of zgeoff/nixie-definitions
    path: /etc/nixie/definitions/current
# the owner's name, which the conversation reads in place of "the owner", and the owner's pronouns
# for the review sentences; both stay out of this public file, in the sops file's settings
owner:
  name: deployment:owner_name
  pronouns:
    they: deployment:owner_pronoun_they
    their: deployment:owner_pronoun_their
# the names the owner calls the agent by, which per-turn retrieval leaves out of its query
agent:
  names:
    - Nix
    - Nixie
