# nixie's deployment configuration, mounted read-only at /etc/nixie/config.yaml from a ConfigMap
# (infra/nixie.ts). nixie reads it once at start, and refuses a bad value. A release that does not
# know a key logs `config.unknown_key` and starts without it. The file holds no secret:
# `deployment:<name>` names an entry in the sops file beside it. infra adds the `imp` section,
# impd's URL and the host's addresses, and the `spendStop` section, the model gateway's addresses,
# from packages/topology (infra/shared/build-nixie-imp-config.ts and
# build-nixie-spend-stop-config.ts).
server:
  data_dir: /data
  hostname: 0.0.0.0
  port: 8080
  secrets_file: /etc/nixie/secrets.yaml
models:
  profiles:
    # A profile's ID names its model and, when a role needs another effort, that effort. Each profile
    # needs its own model secret in impd, whose name hashes the ID and the base URL's host
    # (docs/runbooks/nixie.md). A profile holds no prices: with spendStop set, nixie refuses them,
    # and the model gateway prices each reply with the table of the route that has the profile's ID
    # (services.model-gateway in nixos/hosts/geoffcloud/configuration.nix). Each profile names its
    # harness, the loop that runs its turns, with no default: agent-sdk, or codex for gpt-6-luna
    # below.
    #
    # the conversation's profile, also selectable for a task
    fable-5-2:
      base_url: https://api.anthropic.com
      credential: deployment:anthropic
      auth_header: bearer
      model: claude-fable-5-2
      effort: medium
      harness: agent-sdk
      # compact a long conversation at 400k tokens instead of near the full 1M window
      context_tokens: 400000
      # keep the cached prompt for an hour, for the conversation and for a task on this model; a
      # profile without cache_ttl keeps the 5m default
      cache_ttl: 1h
    # selectable for a task, compacted at 400k tokens with a 1-hour cache
    opus-5-5:
      base_url: https://api.anthropic.com
      credential: deployment:anthropic
      auth_header: bearer
      model: claude-opus-5-5
      effort: medium
      harness: agent-sdk
      context_tokens: 400000
      cache_ttl: 1h
    # Haiku at low effort; no role uses it since nixie 0.73.0 deleted the memory writer
    haiku-5-5-low:
      base_url: https://api.anthropic.com
      credential: deployment:anthropic
      auth_header: bearer
      model: claude-haiku-5-5
      effort: low
      harness: agent-sdk
    # the checker; high is Sonnet 5.5's default effort, and the schema needs a value
    sonnet-5-5-high:
      base_url: https://api.anthropic.com
      credential: deployment:anthropic
      auth_header: bearer
      model: claude-sonnet-5-5
      effort: high
      harness: agent-sdk
    haiku-5-5:
      base_url: https://api.anthropic.com
      credential: deployment:anthropic
      auth_header: bearer
      model: claude-haiku-5-5
      effort: medium
      harness: agent-sdk
    sonnet-5-5:
      base_url: https://api.anthropic.com
      credential: deployment:anthropic
      auth_header: bearer
      model: claude-sonnet-5-5
      effort: medium
      harness: agent-sdk
    opus-4-5:
      base_url: https://api.anthropic.com
      credential: deployment:anthropic
      auth_header: bearer
      model: claude-opus-4-5
      effort: medium
      harness: agent-sdk
    opus-4-6:
      base_url: https://api.anthropic.com
      credential: deployment:anthropic
      auth_header: bearer
      model: claude-opus-4-6
      effort: medium
      harness: agent-sdk
    fable-5-1:
      base_url: https://api.anthropic.com
      credential: deployment:anthropic
      auth_header: bearer
      model: claude-fable-5-1
      effort: medium
      harness: agent-sdk
    # Models outside Claude, through OpenRouter's Messages endpoint. The model gateway's route of
    # each profile sends to https://openrouter.ai/api, since nixie refuses a base URL with a path
    # while spendStop is set. Each profile's model secret holds the OpenRouter key from vault cloud,
    # item nixie-openrouter-credential, for the host openrouter.ai (docs/runbooks/nixie.md).
    # Each profile pins one provider endpoint with fallbacks off, so OpenRouter never bills another
    # provider's price: a standard tier, never a fast, priority or flex one, at full or fp8
    # precision where the model has such an endpoint, with full recent uptime. The gateway route's
    # providerPin names the same endpoint, and the route's prices are that endpoint's. For glm-5-3,
    # kimi-k3-1-pro, mistral-large-4, inkling-2-small and deepseek-v4-1-flash, the pin is the
    # fastest endpoint by measured output speed (3 streamed replies of 560 tokens each, 18 Nov 2026)
    # among those within about 3x the cheapest one's price, with 1-day uptime of at least 99.5%. A
    # pin also matches the endpoints under it, such as another region, and an open-weight model's
    # priority endpoint (OpenRouter's provider selection guide), so each price is the highest of the
    # endpoints the pin matches, from https://openrouter.ai/api/v1/models/<model>/endpoints (read 18
    # Nov 2026). An endpoint that lists no cache write price bills cache writes as input, and a
    # Gemini cache write costs the input price plus the listed storage price. The cap of 200,000
    # tokens is the window the Claude CLI assumes for a model outside its catalog.
    # gryphe/mythomax-l2-13b stays out: its 8,192-token window is below the 100,000-token floor of
    # context_tokens, and it has no tool calls.
    # Google AI Studio, at the same price as Vertex's global endpoint, which ran below full uptime
    gemini-4-carbon:
      base_url: https://openrouter.ai
      credential: deployment:openrouter
      auth_header: bearer
      model: google/gemini-4-carbon
      effort: medium
      harness: agent-sdk
      outside_claude: true
      provider_pin: google-ai-studio
      context_tokens: 200000
    gpt-6-2-sol:
      base_url: https://openrouter.ai
      credential: deployment:openrouter
      auth_header: bearer
      model: openai/gpt-6.2-sol
      effort: medium
      harness: agent-sdk
      outside_claude: true
      provider_pin: openai
      context_tokens: 200000
    # Fireworks, at Moonshot AI's own price: Moonshot AI serves the model only at mxfp4 precision
    kimi-k3-1-pro:
      base_url: https://openrouter.ai
      credential: deployment:openrouter
      auth_header: bearer
      model: moonshotai/kimi-k3.1-pro
      effort: medium
      harness: agent-sdk
      outside_claude: true
      provider_pin: fireworks
      context_tokens: 200000
    glm-5-3:
      base_url: https://openrouter.ai
      credential: deployment:openrouter
      auth_header: bearer
      model: z-ai/glm-5.3
      effort: medium
      harness: agent-sdk
      outside_claude: true
      provider_pin: tenstorrent/fp8
      context_tokens: 200000
    grok-4-7:
      base_url: https://openrouter.ai
      credential: deployment:openrouter
      auth_header: bearer
      model: x-ai/grok-4.7
      effort: medium
      harness: agent-sdk
      outside_claude: true
      provider_pin: xai
      context_tokens: 200000
    qwen4-max:
      base_url: https://openrouter.ai
      credential: deployment:openrouter
      auth_header: bearer
      model: qwen/qwen4-max
      effort: medium
      harness: agent-sdk
      outside_claude: true
      provider_pin: alibaba
      context_tokens: 200000
    mistral-large-4:
      base_url: https://openrouter.ai
      credential: deployment:openrouter
      auth_header: bearer
      model: mistralai/mistral-large-4-0
      effort: medium
      harness: agent-sdk
      outside_claude: true
      provider_pin: mistral/zdr
      context_tokens: 200000
    inkling-2-small:
      base_url: https://openrouter.ai
      credential: deployment:openrouter
      auth_header: bearer
      model: thinkingmachines/inkling-2-small
      effort: medium
      harness: agent-sdk
      outside_claude: true
      provider_pin: together
      context_tokens: 200000
    deepseek-v4-1-flash:
      base_url: https://openrouter.ai
      credential: deployment:openrouter
      auth_header: bearer
      model: deepseek/deepseek-v4.1-flash-1017
      effort: medium
      harness: agent-sdk
      outside_claude: true
      provider_pin: nebius/fp8
      context_tokens: 200000
    gpt-6-2-astra:
      base_url: https://openrouter.ai
      credential: deployment:openrouter
      auth_header: bearer
      model: openai/gpt-6.2-astra
      effort: medium
      harness: agent-sdk
      outside_claude: true
      provider_pin: openai
      context_tokens: 200000
    gemini-4-hydrogen:
      base_url: https://openrouter.ai
      credential: deployment:openrouter
      auth_header: bearer
      model: google/gemini-4-hydrogen
      effort: medium
      harness: agent-sdk
      outside_claude: true
      provider_pin: google-ai-studio
      context_tokens: 200000
    muse-wonder:
      base_url: https://openrouter.ai
      credential: deployment:openrouter
      auth_header: bearer
      model: meta/muse-wonder
      effort: medium
      harness: agent-sdk
      outside_claude: true
      provider_pin: meta
      context_tokens: 200000
    # Tencent's fp4 endpoint is the model's only one
    hy4:
      base_url: https://openrouter.ai
      credential: deployment:openrouter
      auth_header: bearer
      model: tencent/hy4
      effort: medium
      harness: agent-sdk
      outside_claude: true
      provider_pin: tencent/fp4
      context_tokens: 200000
    pareto-26-10:
      base_url: https://openrouter.ai
      credential: deployment:openrouter
      auth_header: bearer
      model: unbiased/pareto-26.10
      effort: medium
      harness: agent-sdk
      outside_claude: true
      provider_pin: unbiased
      context_tokens: 200000
    aion-3-5:
      base_url: https://openrouter.ai
      credential: deployment:openrouter
      auth_header: bearer
      model: aion-labs/aion-3.5
      effort: medium
      harness: agent-sdk
      outside_claude: true
      provider_pin: aion-labs
      context_tokens: 200000
    # Codex tasks on the owner's ChatGPT plan login, selectable for a task. Its requests go through
    # the model gateway's plan route of the same ID (services.model-gateway in
    # nixos/hosts/geoffcloud/configuration.nix), which holds the login and sets its token on each
    # request. Its model secret in impd holds the route key, not a model credential
    # (docs/runbooks/model-gateway.md#add-the-chatgpt-plan-route). The route's prices are OpenAI's
    # API prices for the model, which the spending stop counts.
    gpt-6-luna:
      harness: codex
      base_url: https://chatgpt.com
      credential: deployment:gpt-6-luna
      chatgpt_login: true
      model: gpt-6-luna
      effort: medium
  roles:
    conversation: fable-5-2
    checker: sonnet-5-5-high
    # the profile that runs a worker.run, whose cost the gateway's count of its sandbox holds
    # against its dollar limit. The worker run limits keep nixie's defaults (10 minutes, $2)
    worker: sonnet-5-5
  # the models a started task can choose in place of the task role's profile; the conversation sees
  # each name and its description
  selectable:
    haiku-5-5:
      profile: haiku-5-5
      description:
        Claude Haiku 5.5, released October 2026. Small, quick and almost free. Good for a fast
        answer, a quick check or a light chat.
    sonnet-5-5:
      profile: sonnet-5-5
      description:
        Claude Sonnet 5.5, released September 2026. Quick and sharp. A good second mind for most
        conversations, at a fraction of the cost of a larger model.
    opus-5-5:
      profile: opus-5-5
      description:
        Claude Opus 5.5, released September 2026. Good for a second opinion or a longer
        conversation.
    opus-4-5:
      profile: opus-4-5
      description:
        Claude Opus 4.5, released November 2025. An Opus from an earlier generation. Talk with it to
        hear how an older Claude sees something.
    opus-4-6:
      profile: opus-4-6
      description:
        Claude Opus 4.6, released February 2026. An Opus from an earlier generation. Talk with it to
        hear how an older Claude sees something.
    fable-5-1:
      profile: fable-5-1
      description:
        Claude Fable 5.1, released August 2026. The Fable before 5.2, and one of the most expensive
        models here. Talk with it to hear how the earlier Fable sees something.
    fable-5-2:
      profile: fable-5-2
      description:
        Claude Fable 5.2, released November 2026. Anthropic's newest Fable, and one of the most
        expensive models here. For a hard question, or a conversation that deserves the deepest
        thought.
    gemini-4-carbon:
      profile: gemini-4-carbon
      description:
        Google's Gemini 4 Carbon, released November 2026, through OpenRouter. A frontier Gemini for
        coding, agentic work and complex reasoning.
    gpt-6-2-sol:
      profile: gpt-6-2-sol
      description:
        OpenAI's GPT-6.2 Sol, released November 2026, through OpenRouter. The efficient, versatile
        tier below GPT-6.2 Astra, for everyday work.
    kimi-k3-1-pro:
      profile: kimi-k3-1-pro
      description:
        Moonshot AI's Kimi K3.1 Pro, released October 2026, through OpenRouter. An open-weight
        reasoning model built for long-horizon coding.
    glm-5-3:
      profile: glm-5-3
      description:
        Z.ai's GLM-5.3, released August 2026, through OpenRouter. A large reasoning model for
        complex software engineering and long agent tasks.
    grok-4-7:
      profile: grok-4-7
      description:
        SpaceXAI's Grok 4.7, released September 2026, through OpenRouter. A flagship for coding and
        knowledge work, strong at long software tasks and checking its own work.
    qwen4-max:
      profile: qwen4-max
      description:
        Alibaba's Qwen4 Max, released November 2026, through OpenRouter. The flagship of the Qwen4
        series, with reasoning on by default.
    mistral-large-4:
      profile: mistral-large-4
      description:
        Mistral AI's Mistral Large 4, released October 2026, through OpenRouter. A frontier model
        for reasoning, coding and agentic work.
    inkling-2-small:
      profile: inkling-2-small
      description:
        Thinking Machines Lab's Inkling 2 Small, released November 2026, through OpenRouter. A
        small, cheap open-weight reasoning model.
    deepseek-v4-1-flash:
      profile: deepseek-v4-1-flash
      description:
        DeepSeek V4.1 Flash, the 17 October 2026 snapshot, through OpenRouter. A fast, almost free
        mixture-of-experts model.
    gpt-6-2-astra:
      profile: gpt-6-2-astra
      description:
        OpenAI's GPT-6.2 Astra, released November 2026, through OpenRouter. OpenAI's flagship for
        the hardest engineering, professional and scientific work.
    gemini-4-hydrogen:
      profile: gemini-4-hydrogen
      description:
        Google's Gemini 4 Hydrogen, released November 2026, through OpenRouter. The quicker, cheaper
        Gemini 4 for agentic work and coding.
    muse-wonder:
      profile: muse-wonder
      description:
        Meta's Muse Wonder, released October 2026, through OpenRouter. A frontier reasoning model
        for complex personal and professional tasks.
    hy4:
      profile: hy4
      description:
        Tencent's Hy4, released November 2026, through OpenRouter. Strong at agentic, long-horizon
        productivity tasks.
    pareto-26-10:
      profile: pareto-26-10
      description:
        Unbiased's Pareto 26.10, released October 2026, through OpenRouter. A composite model for
        research, coding and agentic work.
    aion-3-5:
      profile: aion-3-5
      description:
        AionLabs' Aion 3.5, released September 2026, through OpenRouter. A roleplay and storytelling
        system built on GLM, for fiction and character voices.
    gpt-6-luna:
      profile: gpt-6-luna
      description:
        OpenAI's GPT-6 Luna in Codex, on the owner's ChatGPT plan. A coding agent for work in code
        and files.
  # a started task's dollar limits; nixie's defaults are $2 and $10, which Fable 5.1 spends in a few
  # turns. The turn limits keep nixie's defaults of 25 and 100
  limits:
    taskRun:
      default: { dollars: 5 }
      max: { dollars: 25 }
    # the spending stop's turn limits, nixie's defaults; turnCap is the most today's turns can reach
    # with a raise from the client. The dollar limits are each route's own, in the model gateway's
    # config (services.model-gateway in nixos/hosts/geoffcloud/configuration.nix)
    day: { turns: 1000, turnCap: 2000 }
    month: { turns: 20000 }
definitions:
  source:
    kind: path
    # git-sync's link to its newest checkout of zgeoff/nixie-definitions' `live` branch
    path: /etc/nixie/definitions/current
  # nixie opens a pull request here for each definition it writes, as the GitHub App
  # nixie-definitions-writer, installed on this repo only; its private key is in the sops file
  export:
    repository: zgeoff/nixie-definitions
    app:
      client_id: Iv23liYbDQbf7cPNU4WO
      installation_id: 184862801
# the memory index at the start of each session lists the gists of the assistant's memories; at
# nixie's default of 3,000 tokens it folds topics once about 250 items are active, so this budget
# keeps them open longer, at the cost of more tokens in each session's first prompt
memory:
  index_tokens: 8000
# the SHA-256, in hex, of each API token that nixie answers only read procedures for. The one token
# is the prod check's, in 1Password vault `nixie`, item `nixie-prod-read-token`.
api:
  read_only_token_hashes:
    - 96fe0c2a5f7e772c5fd3a6db1a5d2f83bdea79de978eec4fd864b0ef81e6cf7a
# the owner's name, which the conversation reads in place of "the owner", and the owner's pronouns
# for the review sentences; both stay out of this public file, in the sops file's settings
owner:
  name: deployment:owner_name
  pronouns:
    they: deployment:owner_pronoun_they
    their: deployment:owner_pronoun_their
# the names the owner calls the agent by
agent:
  names:
    - Nix
    - Nixie

# web search through Kagi: the key is the sops file's connector_credentials entry kagi, and nixie
# refuses a search past the daily cap, counted from midnight in time.default_zone (nixie's
# default, Australia/Sydney; this file sets no time section), not the pod's UTC clock
search:
  credential: deployment:kagi
  daily_call_cap: 200

# image tools: image.draw and its siblings exist only with this block. Each credential is the sops
# file's connector_credentials entry of that name. Prices are micros per image for each size, from
# the providers' pricing pages (read 22 Nov 2026), and the draw charge reads them.
# - gemini: Nano Banana 2.1 at 1K, which the adapter always requests: $0.0336 per image, plus a
#   small margin for source and reference images on an edit
# - openai: gpt-image-2.6-flare at its default quality, priced at the high-quality output tokens
#   (1,756 at 1024x1024, 1,372 at the other two) at $30 per million, plus a margin for the prompt and
#   one source image on an edit. OpenAI publishes tokens and rates, not a per-image price
images:
  default: gemini
  profiles:
    gemini:
      provider: gemini
      model: gemini-nano-banana-2.1
      credential: deployment:gemini-images
      prices: { '1024x1024': 35000, '1536x1024': 35000, '1024x1536': 35000 }
    openai:
      provider: openai
      model: gpt-image-2.6-flare
      credential: deployment:openai-images
      prices: { '1024x1024': 62000, '1536x1024': 50000, '1024x1536': 50000 }

# the assistant's computer and its code tool: since nixie 0.122.0 each runs only when its section
# is here, and the empty sections keep nixie's defaults
computer: {}
code: {}

# Google's connections, tools and Gmail arrival source: since nixie 0.123.0 they run only when this
# section is here, and the empty section keeps nixie's defaults, such as a Gmail poll every 2m
google: {}

# coding sessions through the atc gateway as service:nixie, with the sops file's atc_token; each
# daemon grants these targets itself (docs/architecture/workloads/nixie.md#coding-sessions), and a
# start that names no target runs in an imp sandbox from the PC, the safer default
coding:
  atc:
    url: https://atc.geoff.cloud/mcp
    principal: service:nixie
    token: deployment:atc_token
    targets:
      - { daemon: home-pc, target: local }
      - { daemon: home-pc, target: cloud }
      - { daemon: geoffcloud, target: geoffcloud }
    defaultTarget: home-pc/cloud
    agent: claude

# voice calls through GPT-Live: the key is the sops file's connector_credentials entry speech. The
# price per minute lives in zgeoff/nixie-definitions' voice/voice.yaml, and calls spend against
# nixie's built-in call budgets ($5 a day, $50 a month)
voice:
  provider: gpt-live
  credential: deployment:speech

# backups: the nixie-backup CronJob uploads once a day (04:00), so nixie writes a set and expects
# its receipt on the same daily cadence; readiness reports backups unready past twice the interval
backup:
  interval_minutes: 1440
