# nixie's deployment configuration, mounted read-only at /etc/nixie/config.yaml from a ConfigMap
# (infra/nixie.ts). nixie reads it once at start and refuses an unknown key. It holds no secret:
# `deployment:<name>` names an entry in the sops file beside it. infra adds the `imp` section,
# impd's URL and the host's addresses, from packages/topology
# (infra/shared/build-nixie-imp-config.ts).
server:
  data_dir: /data
  hostname: 0.0.0.0
  port: 8080
  secrets_file: /etc/nixie/secrets.yaml
models:
  profiles:
    # A profile's ID names its model and, when a role needs another effort, that effort. Each profile
    # needs its own model secret in impd, whose name hashes the ID (docs/runbooks/nixie.md). A
    # selectable model's profile needs prices, in dollars per million tokens, from the Claude API
    # pricing page. Each profile names its harness, the loop that runs its turns, with no default;
    # agent-sdk is the only harness nixie runs.
    #
    # the conversation's profile, and the selectable opus-5-5
    opus-5-5:
      base_url: https://api.anthropic.com
      credential: deployment:anthropic
      auth_header: bearer
      model: claude-opus-5-5
      effort: medium
      harness: agent-sdk
      # compact a long conversation at 400k tokens instead of near the full window
      context_tokens: 400000
      # keep the cached prompt for an hour, for the conversation and for a task on opus-5-5; every
      # other profile keeps the 5m default
      cache_ttl: 1h
      prices: { input: 4, cache_write: 5, cache_write_1h: 8, cached_input: 0.2, output: 20 }
    # the memory writer extracts and files memories from each batch of messages
    haiku-5-5-low:
      base_url: https://api.anthropic.com
      credential: deployment:anthropic
      auth_header: bearer
      model: claude-haiku-5-5
      effort: low
      harness: agent-sdk
    # the checker; high is Sonnet 5.5's default effort, and the schema needs a value
    sonnet-5-5-high:
      base_url: https://api.anthropic.com
      credential: deployment:anthropic
      auth_header: bearer
      model: claude-sonnet-5-5
      effort: high
      harness: agent-sdk
    haiku-5-5:
      base_url: https://api.anthropic.com
      credential: deployment:anthropic
      auth_header: bearer
      model: claude-haiku-5-5
      effort: medium
      harness: agent-sdk
      prices:
        input: 0.1
        cache_write: 0.125
        cache_write_1h: 0.2
        cached_input: 0.01
        output: 0.5
        # Haiku 5.5 prices a whole request at these rates once its prompt passes 100k tokens
        long_prompt:
          over_tokens: 100000
          input: 0.5
          cache_write: 0.625
          cache_write_1h: 1
          cached_input: 0.05
          output: 2.5
    sonnet-5-5:
      base_url: https://api.anthropic.com
      credential: deployment:anthropic
      auth_header: bearer
      model: claude-sonnet-5-5
      effort: medium
      harness: agent-sdk
      prices: { input: 2, cache_write: 2.5, cache_write_1h: 4, cached_input: 0.1, output: 10 }
    opus-4-5:
      base_url: https://api.anthropic.com
      credential: deployment:anthropic
      auth_header: bearer
      model: claude-opus-4-5
      effort: medium
      harness: agent-sdk
      prices: { input: 5, cache_write: 6.25, cache_write_1h: 10, cached_input: 0.5, output: 25 }
    opus-4-6:
      base_url: https://api.anthropic.com
      credential: deployment:anthropic
      auth_header: bearer
      model: claude-opus-4-6
      effort: medium
      harness: agent-sdk
      prices: { input: 5, cache_write: 6.25, cache_write_1h: 10, cached_input: 0.5, output: 25 }
    fable-5-1:
      base_url: https://api.anthropic.com
      credential: deployment:anthropic
      auth_header: bearer
      model: claude-fable-5-1
      effort: medium
      harness: agent-sdk
      prices: { input: 10, cache_write: 12.5, cache_write_1h: 20, cached_input: 0.25, output: 50 }
  roles:
    conversation: opus-5-5
    memory-writer: haiku-5-5-low
    checker: sonnet-5-5-high
  # the models a started task can choose in place of the task role's profile; the conversation sees
  # each name and its description
  selectable:
    haiku-5-5:
      profile: haiku-5-5
      description:
        Claude Haiku 5.5, released October 2026. Small, quick and almost free. Good for a fast
        answer, a quick check or a light chat.
    sonnet-5-5:
      profile: sonnet-5-5
      description:
        Claude Sonnet 5.5, released September 2026. Quick and sharp. A good second mind for most
        conversations, at a fraction of the cost of a larger model.
    opus-5-5:
      profile: opus-5-5
      description:
        Claude Opus 5.5, released September 2026. Good for a second opinion or a longer
        conversation.
    opus-4-5:
      profile: opus-4-5
      description:
        Claude Opus 4.5, released November 2025. An Opus from an earlier generation. Talk with it to
        hear how an older Claude sees something.
    opus-4-6:
      profile: opus-4-6
      description:
        Claude Opus 4.6, released February 2026. An Opus from an earlier generation. Talk with it to
        hear how an older Claude sees something.
    fable-5-1:
      profile: fable-5-1
      description:
        Claude Fable 5.1, released August 2026. Anthropic's most capable model, and the most
        expensive. For a hard question, or a conversation that deserves the deepest thought.
  # a started task's dollar limits; nixie's defaults are $2 and $10, which Fable 5.1 spends in a few
  # turns. The turn limits keep nixie's defaults of 25 and 100
  limits:
    taskRun:
      default: { dollars: 5 }
      max: { dollars: 25 }
definitions:
  source:
    kind: path
    # git-sync's link to its newest checkout of zgeoff/nixie-definitions' `live` branch
    path: /etc/nixie/definitions/current
  # nixie opens a pull request here for each skill it writes, with the token in the sops file
  export:
    repository: zgeoff/nixie-definitions
# the owner's name, which the conversation reads in place of "the owner", and the owner's pronouns
# for the review sentences; both stay out of this public file, in the sops file's settings
owner:
  name: deployment:owner_name
  pronouns:
    they: deployment:owner_pronoun_they
    their: deployment:owner_pronoun_their
# the names the owner calls the agent by, which per-turn retrieval leaves out of its query
agent:
  names:
    - Nix
    - Nixie

# per-turn retrieval: how many earlier messages join the query (nixie's default is 3)
memory:
  retrieval_messages: 1

# web search through Kagi: the key is the sops file's connector_credentials entry kagi, and nixie
# refuses a search past the daily cap, counted from local midnight
search:
  credential: deployment:kagi
  daily_call_cap: 200
