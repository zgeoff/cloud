    # Tencent's fp4 endpoint is the model's only one
    hy4:
      base_url: https://openrouter.ai
      credential: deployment:openrouter
      auth_header: bearer
      model: tencent/hy4
      effort: medium
      harness: agent-sdk
      outside_claude: true
      provider_pin: tencent/fp4
      context_tokens: 200000
      prices:
        input: 0.417
        cache_write: 0.417
        cache_write_1h: 0.417
        cached_input: 0.021
        output: 1.2505
    pareto-26-10:
      base_url: https://openrouter.ai
      credential: deployment:openrouter
      auth_header: bearer
      model: unbiased/pareto-26.10
      effort: medium
      harness: agent-sdk
      outside_claude: true
