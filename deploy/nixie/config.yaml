    deepseek-v4-1-flash:
      base_url: https://openrouter.ai
      credential: deployment:openrouter
      auth_header: bearer
      model: deepseek/deepseek-v4.1-flash-1017
      effort: medium
      harness: agent-sdk
      outside_claude: true
      provider_pin: nebius/fp8
      context_tokens: 200000
      prices:
        input: 0.12
        cache_write: 0.12
        cache_write_1h: 0.12
        cached_input: 0.0024
        output: 0.48
    gpt-6-2-astra:
      base_url: https://openrouter.ai
      credential: deployment:openrouter
      auth_header: bearer
      model: openai/gpt-6.2-astra
      effort: medium
      harness: agent-sdk
      outside_claude: true
      provider_pin: openai
      context_tokens: 200000
      prices:
        input: 8
        cache_write: 10
        cache_write_1h: 10
        cached_input: 0.4
        output: 40
        long_prompt:
          over_tokens: 272000
          input: 16
          cache_write: 20
          cache_write_1h: 20
          cached_input: 0.8
          output: 60
    gemini-4-hydrogen:
      base_url: https://openrouter.ai
      credential: deployment:openrouter
      auth_header: bearer
      model: google/gemini-4-hydrogen
      effort: medium
      harness: agent-sdk
      outside_claude: true
      provider_pin: google-ai-studio
      context_tokens: 200000
      prices:
        input: 1.5
        cache_write: 1.583333
        cache_write_1h: 1.583333
        cached_input: 0.075
        output: 7.5
    muse-wonder:
