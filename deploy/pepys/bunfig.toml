# The deployment installs on its own, apart from the repo's workspaces, with the repo's isolated
# linker and release-age gate.
[install]
linker = "isolated"
exact = true
minimumReleaseAge = 604800

# The @pepys packages release with the host binary that images/pepys/versions.env pins, so they skip
# the gate on the day they publish; the list holds each one the deployment installs, directly or
# through another. The @boxxy packages, @zgeoff/std, @zgeoff/kysely-bun-sqlite, @zgeoff/mcp-auth and @impz/client are first-party. The third-party entries below them
# are the ones pepys's own bunfig.toml excludes at the release, each until it ages past the gate.
# @orpc/client 2.0.0-beta.50 (published 2026-11-09) ages past the gate ~2026-11-16 — remove then (audit-fix)
# @orpc/contract 2.0.0-beta.50 (published 2026-11-09) ages past the gate ~2026-11-16 — remove then (audit-fix)
# @orpc/json-schema 2.0.0-beta.50 (published 2026-11-09) ages past the gate ~2026-11-16 — remove then (audit-fix)
# @orpc/mcp 2.0.0-beta.50 (published 2026-11-09) ages past the gate ~2026-11-16 — remove then (audit-fix)
# @orpc/openapi 2.0.0-beta.50 (published 2026-11-09) ages past the gate ~2026-11-16 — remove then (audit-fix)
# @orpc/server 2.0.0-beta.50 (published 2026-11-09) ages past the gate ~2026-11-16 — remove then (audit-fix)
# @orpc/shared 2.0.0-beta.50 (published 2026-11-09) ages past the gate ~2026-11-16 — remove then (audit-fix)
# @openapi-spec/downgrader 0.8.0 (published 2026-11-09) ages past the gate ~2026-11-16 — remove then (audit-fix)
# @openapi-spec/router 0.8.0 (published 2026-11-09) ages past the gate ~2026-11-16 — remove then (audit-fix)
# @openapi-spec/types 0.8.0 (published 2026-11-09) ages past the gate ~2026-11-16 — remove then (audit-fix)
# @standard-server/aws-lambda 0.16.0 (published 2026-11-09) ages past the gate ~2026-11-16 — remove then (audit-fix)
# @standard-server/core 0.16.0 (published 2026-11-09) ages past the gate ~2026-11-16 — remove then (audit-fix)
# @standard-server/fastify 0.16.0 (published 2026-11-09) ages past the gate ~2026-11-16 — remove then (audit-fix)
# @standard-server/fetch 0.16.0 (published 2026-11-09) ages past the gate ~2026-11-16 — remove then (audit-fix)
# @standard-server/node 0.16.0 (published 2026-11-09) ages past the gate ~2026-11-16 — remove then (audit-fix)
# @standard-server/peer 0.16.0 (published 2026-11-09) ages past the gate ~2026-11-16 — remove then (audit-fix)
# @standard-server/shared 0.16.0 (published 2026-11-09) ages past the gate ~2026-11-16 — remove then (audit-fix)
# @orpc/standard-server 1.16.2 (published 2026-11-06) ages past the gate ~2026-11-13 — remove then (audit-fix)
# @orpc/standard-server-fetch 1.16.2 (published 2026-11-06) ages past the gate ~2026-11-13 — remove then (audit-fix)
# @orpc/standard-server-peer 1.16.2 (published 2026-11-06) ages past the gate ~2026-11-13 — remove then (audit-fix)
minimumReleaseAgeExcludes = [
  "@boxxy/content-hash",
  "@boxxy/model",
  "@boxxy/pepys",
  "@pepys/api",
  "@pepys/cli",
  "@pepys/contract",
  "@pepys/ingest",
  "@pepys/kit",
  "@pepys/kysely-turso",
  "@pepys/schema",
  "@pepys/source-github",
  "@pepys/source-telemetry",
  "@zgeoff/std",
  "@zgeoff/kysely-bun-sqlite",
  "@zgeoff/mcp-auth",
  "@impz/client",
  "@orpc/client",
  "@orpc/contract",
  "@orpc/json-schema",
  "@orpc/mcp",
  "@orpc/openapi",
  "@orpc/server",
  "@orpc/shared",
  "@openapi-spec/downgrader",
  "@openapi-spec/router",
  "@openapi-spec/types",
  "@standard-server/aws-lambda",
  "@standard-server/core",
  "@standard-server/fastify",
  "@standard-server/fetch",
  "@standard-server/node",
  "@standard-server/peer",
  "@standard-server/shared",
  "@orpc/standard-server",
  "@orpc/standard-server-fetch",
  "@orpc/standard-server-peer",
]
