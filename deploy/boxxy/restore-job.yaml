# Generated by `bun run write:restore-job` from the backup pod in
# infra/cluster/build-atc-gateway-backup-pod-spec.ts and the stack config's atcGateway.backupImage: never
# edit it by hand. `bun run check:restore-job` fails when it differs.
#
# One-off restore of the boxxy server's store, from the boxxy-backup CronJob's repository, with
# the atc gateway's backup image and its own entrypoint. Stop the server first
# (docs/runbooks/boxxy.md), then:
#   ssh root@geoffcloud k3s kubectl create -f - < deploy/boxxy/restore-job.yaml
# To list the snapshots instead, set args to ['ls']; to restore another snapshot, set SNAPSHOT. The
# claim is data-boxxy-0, the server's own. The Secret is the CronJob's fixed-name Secret.
apiVersion: batch/v1
kind: Job
metadata:
  generateName: boxxy-restore-
  namespace: boxxy
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: restore
          image: ghcr.io/zgeoff/atc-gateway-backup:2.24.0-r2@sha256:ac47d4a0409e81be7304c46372f2d855083cd45315fe30529dc3279ccae9f377
          args:
            - restore
          env:
            - name: STATE_DIR
              value: /state
            - name: HOME
              value: /tmp
            - name: SNAPSHOT
              value: latest
          envFrom:
            - secretRef:
                name: boxxy-backup
          volumeMounts:
            - name: state
              mountPath: /state
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: data-boxxy-0
        - name: tmp
          emptyDir: {}
