# Secret-scanning config for gitleaks (PR job + pre-commit hook). Extends the
# default ruleset. This repo is public: every secret lives in the 1Password
# `cloud` vault, and `.env` holds only op:// references.

[extend]
useDefault = true

# Go module checksums are public content hashes. A module whose name holds a word such as
# "openapi" makes the hash beside it match generic-api-key.
[[allowlists]]
description = "Go module checksums"
paths = ['''(^|/)(go|tools)\.sum$''']
