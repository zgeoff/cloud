# pnpm-style symlinked node_modules — no phantom dependencies
[install]
linker = "isolated"

# bun add saves exact versions, no ^/~ ranges
exact = true

# supply-chain guard: only install versions published >= 7 days ago
minimumReleaseAge = 604800

# first-party packages skip the gate; their own dependencies stay behind it.
# Renovate bumps @zgeoff packages as soon as they publish, so each one cloud
# uses needs an entry here, or bun install refuses the bump.
# @impz/client releases with impd's API, so the preview service's typed client
# would otherwise trail the impd it talks to by a week.
# @impz/testing, the real impd that the tests start, releases with @impz/client and pins its version.
# @heynixie/contract releases with nixie, and the release check bumps it in the
# same PR as the nixie image pin, so the scripts' nixie calls type-check against
# the release they deploy.
# @boxxy/server and the @boxxy packages it depends on release together, and the
# boxxy image compiles the server from them; @atcx/contract and @pepys/kit are
# the atc and pepys contracts those packages are built against, and @wringer/core
# the verify library that @boxxy/verifier-wringer wraps.
# @noslop/cli 0.4.30 (published 2026-11-17) ages past the gate ~2026-11-24 — remove then (audit-fix)
minimumReleaseAgeExcludes = [
  "@atcx/contract",
  "@boxxy/auth-oauth",
  "@boxxy/caller-proof-imp",
  "@boxxy/closeout",
  "@boxxy/content-hash",
  "@boxxy/contract",
  "@boxxy/dispatch",
  "@boxxy/forge-github",
  "@boxxy/model",
  "@boxxy/notifier-atc",
  "@boxxy/pepys",
  "@boxxy/planning",
  "@boxxy/prompt-template",
  "@boxxy/review-noslop",
  "@boxxy/rules",
  "@boxxy/server",
  "@boxxy/store-sqlite",
  "@boxxy/train",
  "@boxxy/verifier-wringer",
  "@boxxy/worker-atc",
  "@heynixie/contract",
  "@impz/client",
  "@impz/testing",
  "@noslop/cli",
  "@pepys/kit",
  "@wringer/core",
  "@zgeoff/agent-hooks",
  "@zgeoff/bun-test-extended",
  "@zgeoff/chex",
  "@zgeoff/diet",
  "@zgeoff/format-codemod",
  "@zgeoff/kysely-bun-sqlite",
  "@zgeoff/mcp-auth",
  "@zgeoff/oxlint-config",
  "@zgeoff/rig",
  "@zgeoff/std",
  "@zgeoff/testing",
]

[test]
# The root run covers infra and scripts: it registers jest-extended matchers, seeds faker once
# for the run, restores env overrides, runs the shared test network, and starts a shared impd per
# file. The health-check worker is its own package with
# its own preload, so `bun run test:health-check` runs it from its directory, and the preview
# service and the files service likewise run their own, with `bun run test:preview` and
# `bun run test:files`. The TypeScript journeys in scripts/e2e/ are a lane, not part of the unit run, so
# `bun run test:e2e` runs them from their directory with their own preload.
preload = [
  "@zgeoff/bun-test-extended",
  "./infra/src/test-utils/pin-faker-seed.ts",
  "@zgeoff/testing/preload",
  "./scripts/src/test-utils/network.ts",
  "./scripts/src/test-utils/register-shared-impd.ts",
]
# rig's ignore patterns replace this list in the unit run, so the ignore list in rig.config.ts names
# these folders again
pathIgnorePatterns = ["workers/**", "packages/preview/**", "packages/files/**", "scripts/e2e/**"]
