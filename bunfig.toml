# pnpm-style symlinked node_modules — no phantom dependencies
[install]
linker = "isolated"

# bun add saves exact versions, no ^/~ ranges
exact = true

# supply-chain guard: only install versions published >= 7 days ago
minimumReleaseAge = 604800

# @zgeoff/oxlint-config and @zgeoff/imp-client, first-party packages, are pinned
# to releases younger than the gate; each pinned version's provenance is checked
# before the pin, and their own dependencies stay behind the gate. imp-client
# releases with impd's API, so the preview service's typed client would otherwise
# trail the impd it talks to by a week.
minimumReleaseAgeExcludes = ["@zgeoff/oxlint-config", "@zgeoff/imp-client"]

[test]
# The root run covers infra and scripts: it registers jest-extended matchers, seeds faker once
# for the run, and runs the scripts' MSW server. The health-check worker is its own package with
# its own preload, so `bun run test:health-check` runs it from its directory, and the preview
# service likewise runs its own, with `bun run test:preview`.
preload = [
  "@zgeoff/bun-test-extended",
  "./infra/test-utils/seed-faker.ts",
  "./scripts/mocks/register-mock-server.ts",
]
pathIgnorePatterns = ["workers/**", "packages/preview/**"]
