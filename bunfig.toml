# pnpm-style symlinked node_modules — no phantom dependencies
[install]
linker = "isolated"

# bun add saves exact versions, no ^/~ ranges
exact = true

# supply-chain guard: only install versions published >= 7 days ago
minimumReleaseAge = 604800

# first-party packages skip the gate; their own dependencies stay behind it.
# Renovate bumps @zgeoff packages as soon as they publish, so each one cloud
# uses needs an entry here, or bun install refuses the bump.
# @impz/client releases with impd's API, so the preview service's typed client
# would otherwise trail the impd it talks to by a week.
# @heynixie/contract releases with nixie, and the release check bumps it in the
# same PR as the nixie image pin, so the scripts' nixie calls type-check against
# the release they deploy.
# The @pepys packages release with the pepys host binary that images/pepys/versions.env pins, so the
# image's modules and programs come from the same release as its host on the day it publishes. The
# list holds each one the image's build installs, the ones it imports and their own.
minimumReleaseAgeExcludes = [
  "@heynixie/contract",
  "@impz/client",
  "@pepys/api",
  "@pepys/cli",
  "@pepys/contract",
  "@pepys/ingest",
  "@pepys/kit",
  "@pepys/kysely-turso",
  "@pepys/schema",
  "@pepys/source-github",
  "@pepys/source-telemetry",
  "@zgeoff/agent-hooks",
  "@zgeoff/bun-test-extended",
  "@zgeoff/chex",
  "@zgeoff/diet",
  "@zgeoff/format-codemod",
  "@zgeoff/oxlint-config",
  "@zgeoff/rig",
  "@zgeoff/std",
]

[test]
# The root run covers infra and scripts: it registers jest-extended matchers, seeds faker once
# for the run, and runs the scripts' MSW server. The health-check worker is its own package with
# its own preload, so `bun run test:health-check` runs it from its directory, and the preview
# service and the files service likewise run their own, with `bun run test:preview` and
# `bun run test:files`. The TypeScript journeys in e2e/ are a lane, not part of the unit run, so
# `bun run test:e2e` runs them from their directory with their own preload.
preload = [
  "@zgeoff/bun-test-extended",
  "./infra/test-utils/pin-faker-seed.ts",
  "./scripts/mocks/register-mock-server.ts",
]
# rig's ignore patterns replace this list in the unit run, so the ignore list in rig.config.ts names
# these folders again
pathIgnorePatterns = ["workers/**", "packages/preview/**", "packages/files/**", "e2e/**"]
