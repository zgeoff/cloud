# Git hooks. pre-commit fixes staged files only (fast); pre-push checks what
# the branch changes, plus the cheap whole-tree gates. CI runs every
# whole-tree check: type-aware lint, dead code, and the full test suites.

pre-commit:
  piped: true
  jobs:
    - name: oxlint --fix
      glob: '*.{js,mjs,cjs,ts,mts,cts}'
      run: node_modules/.bin/oxlint --fix --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    - name: oxfmt
      glob: '*.{js,mjs,cjs,ts,mts,cts,json,jsonc,md,yml,yaml}'
      run: node_modules/.bin/oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    - name: format-codemod
      glob: '*.ts'
      # the generated SDK and nixie's API types are in .formatignore; with
      # only those staged, format-codemod would exit 2 on "no files matched"
      exclude:
        - 'sdk/**'
        - 'scripts/nixie-api/openapi.d.ts'
      run: node_modules/.bin/format-codemod --quiet {staged_files}
      stage_fixed: true
    - name: gofmt
      glob: 'provider/**/*.go'
      run: gofmt -l -w {staged_files}
      stage_fixed: true
    # after the fixers, so it checks what they wrote; skipped when no staged
    # file matches the glob
    - name: typecheck
      glob: '*.{js,mjs,cjs,ts,mts,cts,json,jsonc}'
      run: bun run typecheck
    # last so it scans what the fixers above re-staged; needs the gitleaks
    # binary on PATH (mise: `mise use -g gitleaks`)
    - name: gitleaks
      run: gitleaks git --pre-commit --staged --redact --no-banner

commit-msg:
  jobs:
    - name: commitlint
      run: node_modules/.bin/commitlint --edit {1}

pre-push:
  # Sequential, to bound memory on a small host.
  piped: true
  jobs:
    - name: format:check
      run: bun run format:check
    - name: lint
      files: bun run --silent files:branch
      glob: '*.{js,mjs,cjs,ts,mts,cts}'
      # oxlint ignores the generated SDK, and exits 1 when every file it gets is ignored
      exclude:
        - 'sdk/**'
      run: bun run lint:files {files}
    # the four linters run their pinned tools in the Nix image, so they need Docker; each lints the
    # whole tree, and runs only for a branch that changes a file of its kind
    - name: lint:sh
      files: bun run --silent files:branch
      glob:
        - '*.sh'
        - 'images/agent/sbin/*'
        - '.editorconfig'
      run: bun run lint:sh
    - name: lint:nix
      files: bun run --silent files:branch
      glob: '*.nix'
      run: bun run lint:nix
    - name: lint:py
      files: bun run --silent files:branch
      glob: '*.py'
      run: bun run lint:py
    - name: lint:actions
      # package.json too: the step check reads its script names
      files: bun run --silent files:branch
      glob:
        - '.github/workflows/*'
        - 'package.json'
      run: bun run lint:actions
    - name: pulumi pins
      run: bun run check:pulumi-pins
    - name: topology
      run: bun run check:topology
    - name: typecheck
      run: bun run typecheck
    - name: test
      files: bun run --silent files:branch
      glob: '*.ts'
      run: bun run test:related {files}
    - name: test:scripts
      # every shell suite, for a branch that changes a shell file; deletions count, so a branch
      # that deletes a script still runs the suites that may source it
      files: bun run --silent files:branch --include-deleted
      glob:
        - '*.sh'
        - 'images/agent/sbin/*'
      run: bun run test:scripts
    - name: provider
      # Deletions count: a branch that only deletes provider/ files must still
      # run the check, so this listing keeps them.
      files: bun run --silent files:branch --include-deleted
      glob: 'provider/**'
      run: bun run provider:check
    - name: sdk
      # sdk:gen builds the provider and needs the Pulumi CLI, so it runs only for a branch that
      # changes the provider or the SDK; deletions count, as for the provider job
      files: bun run --silent files:branch --include-deleted
      glob:
        - 'provider/**'
        - 'sdk/**'
      run: bun run check:sdk
